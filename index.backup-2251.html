/*═══════════════════════════════════════════════════════════════════════════
  12 · CAR PHYSICS
═══════════════════════════════════════════════════════════════════════════*/
const CARP = {
  m: 1290, Iz: 1750, lf: 1.48, lr: 1.52,
  /* The rear must hold more than the front. With muR below muF the rear axle
     saturates first, so at the limit the car snaps into oversteer — survivable
     with an analogue stick, hopeless with a keyboard, where every input is
     full lock or nothing. Set up to push wide instead: run out of grip and the
     nose washes out, you lift, and it tucks back in. The handbrake still cuts
     muR by two thirds, so a deliberate drift is one keypress away. */
  Cf: 132000, Cr: 146000, muF: 1.26, muR: 1.42,
  /* Constant force at every speed meant the engine was traction-limited from
     rest to top speed, so pressing boost changed the field of view and the
     exhaust and nothing else. Real engines deliver roughly constant power:
     force falls as speed rises, which is what makes the last thirty km/h feel
     hard-won and gives boost something to actually do. `engine` is now just
     the low-gear force ceiling. */
  engine: 10600, power: 250000, brakeF: 16200, drag: 0.78, roll: 22,
  maxSteer: 0.58,
  hcg: 0.46,          // centre-of-gravity height, for longitudinal load transfer
  brakeBias: 0.68,    // fraction of braking at the front axle
};
const car = {
  s: 0, n: 0, yaw: 0,               // road coords + heading relative to tangent
  vLong: 0, vLat: 0, omega: 0,
  y: 0, vy: 0, air: false,
  pitch:0, roll:0, ride:0,
  wheelSpin: 0, steer: 0, steerVis: 0,
  boost: 1, boosting:false, boostAmt:0,
  slip: 0, screech: 0, offroad: 0,
  dist: 0, rpm: 900, gear: 1, shiftT: 0,
  landImpact: 0, rough: 0,
  ax: 0, wheelslip: 0,
};
const KEYS_DOWN = {};
const input = { th:0, br:0, st:0, hb:0, bo:0 };

/* Understeer gradient — how much extra lock the car needs on top of the pure
   geometry as speed rises. Shared by the steering limiter and by both pilots,
   so all three agree on what a given angle will actually do. */
const KUS = 0.0017, WB = CARP.lf + CARP.lr;
/** Steer angle that turns the whole width of the stick into something useful.
    The old limiter allowed 19° at 90 km/h when the tyres could only exploit
    about 4°, so a single tap of a key was a five-fold over-correction and the
    car snapped sideways — which is precisely what "the controls are broken"
    feels like. Full lock now sits just past what the front tyres can hold, so
    the input maps onto the car's actual capability: pinning a key gives the
    hardest turn available, and a little more asks it to understeer. */
function steerCapAt(spd){
  const v = Math.max(spd, 6);
  return Math.min(CARP.maxSteer, 1.45*CARP.muF*GRAV*(WB + KUS*v*v)/(v*v));
}
/** Steer angle that would follow curvature k at this speed, in radians. */
function steerForCurve(k, spd){ return k*(WB + KUS*spd*spd); }

/** Drop the body onto its springs at rest, wherever it currently stands.
    The equilibrium is not the ground: the car hangs GRAV/SUSP_K below the
    unloaded ride height, and starting anywhere else means the first frame
    spends a spring's worth of energy correcting the placement. */
function settleSuspension(){
  car.y = sampleWheels().avg + RIDE - GRAV/SUSP_K;
  car.vy = 0; car.air = false; car.airT = 0;
}
function resetCar(){
  car.s=0; car.n=0; car.yaw=0; car.vLong=0; car.vLat=0; car.omega=0;
  car.dist=0;
  car.boost=1; car.pitch=0; car.roll=0; car.slip=0; car.rpm=900; car.gear=1;
  car.offroad=0; car.boostAmt=0; car.landImpact=0;
  input.th=input.br=input.st=input.hb=0; input.bo=false;
  settleSuspension();
  trailReset();
  placeCar(); camSnap();
}

const RIDE = 0.045;
const SUSP_K = 165, SUSP_C = 19.5, TRAVEL = 0.34, GRAV = 9.81;

function stepPhysics(dt){
  const th = input.th, br = input.br, hb = input.hb;
  const boostOn = input.bo && car.boost>0.02 && car.vLong>3;
  car.boosting = boostOn;
  car.boost = clamp(car.boost + (boostOn ? -dt*0.30 : dt*0.135), 0, 1);
  car.boostAmt = damp(car.boostAmt, boostOn?1:0, 7, dt);

  const spd = Math.abs(car.vLong);
  const steerCap = steerCapAt(spd);
  const stTarget = input.st * steerCap;
  car.steer = damp(car.steer, stTarget, 16, dt);
  car.steerVis = damp(car.steerVis, input.st, 11, dt);

  const v = Math.max(2.2, spd);
  const L = CARP.lf + CARP.lr;
  const dir = Math.sign(car.vLong||1);
  // slip angles
  const aF = Math.atan2(car.vLat + car.omega*CARP.lf, v) - car.steer*dir;
  const aR = Math.atan2(car.vLat - car.omega*CARP.lr, v);
  car.slipR = aR;
  const W  = CARP.m*GRAV;
  /* Longitudinal load transfer, from the previous step's acceleration. This is
     what makes the car feel like it has mass: braking pushes weight onto the
     nose and frees the rear to rotate, power pushes it back and plants the
     drive axle. Without it, entry and exit of a corner feel identical. */
  const dFz = clamp(CARP.m*car.ax*CARP.hcg/L, -0.40*W, 0.40*W);
  const FzF = Math.max(700, W*CARP.lr/L - dFz);
  const FzR = Math.max(700, W*CARP.lf/L + dFz);
  // grip fades in and out of flight instead of snapping — a hard cliff makes
  // every small crest feel like the steering was unplugged
  const gripScale = (1 - car.airT*0.93) * (1 - car.offroad*0.20);
  // A locked rear axle loses both its friction ceiling *and* most of its
  // cornering stiffness — cutting only mu leaves the tail stubbornly planted.
  const muR = (1 - hb*0.54) * CARP.muR * gripScale;
  const muF = CARP.muF * gripScale;
  const Cr  = CARP.Cr * (1 - hb*0.48);
  const capF = muF*FzF, capR = muR*FzR;

  /* ---- longitudinal demand, resolved before lateral so the two can share a
     friction budget. A tyre has one contact patch: everything spent driving or
     braking is not available for cornering, and modelling that is the single
     biggest difference between a car that can be placed and one that just
     slides off whenever it feels like it. */
  const boostMul = 1 + car.boostAmt*0.47;
  const tractive = Math.min(CARP.engine, CARP.power/Math.max(v, 8)) * boostMul;
  const brakeF_ = br*CARP.brakeF;
  let fxF = -brakeF_*CARP.brakeBias*dir;
  let fxR = th*tractive - brakeF_*(1-CARP.brakeBias)*dir;
  // handbrake locks the rears for rotation, it should not scrub the car to a
  // standstill — throttle holds the slide, which is the whole point of a drift
  if(hb) fxR -= 2350*(1-th*0.55)*dir;
  /* No axle may spend its whole friction circle going forwards or backwards.
     Braking flat out, the rear was being asked for more than its entire budget
     after load transfer — clamping it to exactly the limit leaves precisely
     nothing for cornering, so the tail left the moment the wheel was turned,
     every time. A road car fits a proportioning valve to prevent this; these
     limits are the same idea, tightest on the rear under braking because rear
     lockup is what actually spins a car. Rear-wheel drive, so the drive axle
     is traction-limited too: floor it from rest and the tyres give up before
     the engine does. */
  fxF = clamp(fxF, -capF*0.95, capF*0.95);
  const rLim = capR*(fxR >= 0 ? 0.92 : 0.78);
  const fxRcl = clamp(fxR, -rLim, rLim);
  car.wheelslip = damp(car.wheelslip, Math.min(1, Math.abs(fxR-fxRcl)/2600), 9, dt);
  fxR = fxRcl;

  const roomF = Math.sqrt(Math.max(0, 1 - (fxF/capF)*(fxF/capF)));
  const roomR = Math.sqrt(Math.max(0, 1 - (fxR/capR)*(fxR/capR)));
  const FyF = clamp(-CARP.Cf*aF, -capF*roomF, capF*roomF);
  const FyR = clamp(-Cr*aR,      -capR*roomR, capR*roomR);

  let Fx = fxF + fxR;
  Fx -= CARP.drag*car.vLong*Math.abs(car.vLong);
  Fx -= (CARP.roll + car.offroad*120)*car.vLong;
  if(car.air) Fx = lerp(Fx, -CARP.drag*car.vLong*Math.abs(car.vLong), car.airT||0);
  car.ax = Fx/CARP.m;

  car.vLong += (car.ax + car.vLat*car.omega)*dt;
  car.vLat  += ((FyF*Math.cos(car.steer)+FyR)/CARP.m - car.vLong*car.omega)*dt;
  car.omega += ((CARP.lf*FyF*Math.cos(car.steer) - CARP.lr*FyR)/CARP.Iz)*dt;

  /* Stability assist. The steady-state bicycle model says what yaw rate the
     steering angle being held is actually asking for; nudging toward it does
     nothing while the car is obeying, and quietly catches it when it is not.
     This is why the car can be thrown at a corner and still be recoverable —
     it replaces the old hard damping cliff, which grabbed the moment slip
     crossed a threshold and so felt arbitrary. Off under handbrake, because
     that is the one time the driver is asking for the rear to leave. */
  const refRaw = car.vLong*car.steer/(L + KUS*car.vLong*car.vLong);
  const yawCap = muF*GRAV/Math.max(v, 3);
  const ref = clamp(refRaw, -yawCap, yawCap);
  /* Weak at walking pace so the car can still be spun on purpose, firm at the
     speeds where a spin is neither fun nor recoverable. Cutting it out entirely
     under handbrake made the drift unrecoverable rather than lively: the tail
     went past ninety degrees and stayed there, which is a spin, not a drift.
     Keeping a third of it means the slide holds where you put it and comes
     back when you straighten the wheel. */
  const assist = 2.1*smooth(4, 26, spd)*(1 - hb*0.66)*(1-car.offroad*0.55)*(1-car.airT);
  car.omega += (ref - car.omega)*Math.min(1, assist*dt);

  /* Extra damping deep in a slide, ramped rather than switched. Past about 55°
     the tail is no longer coming back on its own at any steering angle, so the
     ramp is steep beyond there — the difference between a drift you can hold
     and a spin you can only watch. */
  const overSlip = clamp((Math.abs(aR) - 0.30)/0.44, 0, 1);
  car.omega *= Math.exp(-(0.20 + overSlip*overSlip*7.5)*dt);

  /* In the air there is no grip, so nothing was stopping whatever rotation the
     car left the ground with from continuing all the way round — crest a rise
     at speed and you landed backwards through no fault of your own. A real car
     carries its heading over a jump; polar inertia and aerodynamics see to it.
     Bleeding yaw and sideslip while airborne is what makes a crest feel like
     hang time rather than like the steering being unplugged. */
  if(car.airT > 0.02){
    const k = car.airT*3.4;
    car.omega *= Math.exp(-k*dt);
    car.vLat  *= Math.exp(-k*0.75*dt);
  }
  if(car.vLong < 0) car.vLong = Math.max(car.vLong, -9);

  // move along the road frame
  const cy=Math.cos(car.yaw), sy=Math.sin(car.yaw);
  const ds = (car.vLong*cy - car.vLat*sy)*dt;
  const dn = (car.vLong*sy + car.vLat*cy)*dt;
  const kap = curvatureAt(car.s);
  car.s += ds; car.n += dn;
  car.yaw += car.omega*dt - kap*ds;
  car.yaw = Math.atan2(Math.sin(car.yaw), Math.cos(car.yaw));
  car.dist += Math.abs(ds);

  // soft shoulder rather than an invisible wall: resistance ramps in past 24 m
  // so wandering wide feels like deep gravel, not a collision with nothing
  const nAbs = Math.abs(car.n);
  if(nAbs > 24){
    const a = -Math.sign(car.n)*Math.min((nAbs-24)*(nAbs-24)*0.055, 14)*dt;
    car.vLong += -Math.sin(car.yaw)*a;      // road-frame push, body-frame state
    car.vLat  +=  Math.cos(car.yaw)*a;
    car.n = clamp(car.n, -38, 38);
  }

  /* Ramped from the gravel out to the embankment, not from the paint. Losing a
     third of the grip the instant a tyre kisses the shoulder means any wander —
     and on a road that is never straight there is always some — compounds into
     a slide. The verge should cost you time, not the car. */
  car.offroad = damp(car.offroad, smooth(6.4, 12.5, Math.abs(car.n)), 8, dt);
  car.slip = damp(car.slip, clamp(Math.abs(car.vLat)/8.5,0,1), 10, dt);
  car.screech = clamp(car.slip*1.25 * smooth(4,16,spd), 0, 1);

  // wheel + engine
  car.wheelSpin += (car.vLong/WHEEL.rr)*dt;
  const gears=[3.2,2.15,1.55,1.18,0.95,0.80];
  let g=0; const kmh=spd*3.6;
  const cuts=[52,95,140,186,235];
  while(g<cuts.length && kmh>cuts[g]) g++;
  car.gear = g+1;
  const gr = gears[Math.min(g,gears.length-1)];
  car.rpm = clamp(900 + spd*gr*93, 850, 8600);

  /* ---- suspension / vertical ---- */
  const gnd = sampleWheels();
  const restY = gnd.avg + RIDE + 0.0;
  let acc = -GRAV;
  const ext = car.y - restY;
  car.ext = ext;
  if(ext < TRAVEL){
    /* Bound the deflection the spring is allowed to see. This is a bare Hooke's
       law, so a chassis that finds itself a metre below its ride height — after
       a restart, a teleport, or the ground stepping up under it — gets answered
       with thirty g upward and lands somewhere over the treeline. A real strut
       simply runs out of travel and hits a bump stop; bounding the deflection
       bounds the force the same way. */
    const d = clamp(ext, -TRAVEL, TRAVEL);
    // rebound-biased, as on every real car: soft into the bump so it is
    // absorbed, firm on the way back out so the body does not pogo over crests
    acc += (-d)*SUSP_K - car.vy*SUSP_C*(car.vy > 0 ? 2.1 : 1.0);
    car.air = false;
  } else car.air = true;
  car.airT = damp(car.airT||0, car.air?1:0, 9, dt);
  car.vy += acc*dt;
  // nothing legitimate leaves the ground at 20 m/s; this is the backstop that
  // keeps a bad frame from turning into a ballistic arc over the scenery
  car.vy = clamp(car.vy, -45, 20);
  car.y  += car.vy*dt;
  if(car.y < restY-0.26){ car.y = restY-0.26; if(car.vy<0){ car.landImpact = Math.min(1,-car.vy/9); car.vy*=-0.16; } }

  // pitch / roll from wheel heights + weight transfer
  const accelLong = car.ax;
  const accelLat  = ((FyF+FyR)/CARP.m);
  // clamped: a wheel dropping into a gully otherwise throws the body (and the
  // chase cam that reads it) to near-vertical
  const geoPitch = clamp(Math.atan2(gnd.front-gnd.rear, CARP.lf+CARP.lr), -0.22, 0.22);
  const geoRoll  = clamp(Math.atan2(gnd.left-gnd.right, 1.73), -0.20, 0.20);
  car.pitch = damp(car.pitch, geoPitch - clamp(accelLong*0.0072,-0.09,0.09), 9, dt);
  car.roll  = damp(car.roll , geoRoll  + clamp(accelLat *0.0085,-0.12,0.12), 8.5, dt);
  car.rough = damp(car.rough, gnd.rough, 6, dt);
  car.landImpact = damp(car.landImpact, 0, 6, dt);
}

const _wp = {x:0,y:0,z:0};
/* Height of the drivable surface at road coordinates, blended.
   This used to switch outright from the road profile to the terrain field at
   6.9 m, and the two disagree by the better part of a metre — so a wheel
   drifting a hand's width past that line fell off a step, launched the car and
   spat it into a spin. On a road that is never straight, the car wandering
   wide by a metre is normal; it must not be a catastrophe. */
function surfaceAt(s, n){
  const f = frameAt(s);
  const road = roadSurfaceY(f, n);
  const an = Math.abs(n);
  if(an <= RD.half + 0.5) return road;
  const cs=Math.cos(f.h), sn=Math.sin(f.h);
  const terr = terrainHeight(f.x+cs*n, f.z-sn*n);
  return lerp(road, terr, smooth(RD.half+0.5, RD.verge+3.5, an));
}
function sampleWheels(){
  const cy=Math.cos(car.yaw), sy=Math.sin(car.yaw);
  let front=0, rear=0, left=0, right=0, sum=0, mn=1e9, mx=-1e9;
  for(let i=0;i<4;i++){
    const w = WPOS[i];
    const lx=w[0], lz=w[1];
    const dsW =  lz*cy - lx*sy;
    const dnW =  lz*sy + lx*cy;
    const s = car.s + dsW, n = car.n + dnW;
    const h = surfaceAt(s, n);
    if(i<2) front+=h*0.5; else rear+=h*0.5;
    if(w[0]>0) left+=h*0.5; else right+=h*0.5;
    sum+=h*0.25;
    if(h<mn)mn=h; if(h>mx)mx=h;
  }
  return {avg:sum, front, rear, left, right, rough: clamp((mx-mn)*1.6,0,1)};
}

/*═══════════════════════════════════════════════════════════════════════════
  13 · CHASE CAMERA
═══════════════════════════════════════════════════════════════════════════*/
const cam = {
  pos: new THREE.Vector3(0,6,-14),
  vel: new THREE.Vector3(),
  look: new THREE.Vector3(),
  lookVel: new THREE.Vector3(),
  fov: 62, roll: 0, shake: 0,
};
const _cp = new THREE.Vector3(), _ct = new THREE.Vector3(), _tmp = new THREE.Vector3();
const _ctPrev = new THREE.Vector3(), _anchorVel = new THREE.Vector3(), _relVel = new THREE.Vector3();

/** Drop the rig straight onto its anchor. Needed whenever the car teleports
    (restart, harness seek) or the spring spends seconds flying across the map. */
function camSnap(){
  const f = frameAt(car.s);
  const worldYaw = f.h + car.yaw;
  roadToWorld(car.s, car.n, _cp);
  cam.pos.set(_cp.x - Math.sin(worldYaw)*8.6, car.y + 3.1, _cp.z - Math.cos(worldYaw)*8.6);
  cam.vel.set(0,0,0);
  roadToWorld(car.s + 18, car.n*0.55, cam.look); cam.look.y += 1.55;
  _ctPrev.copy(cam.pos); cam.init = true;
  cam.roll = 0; cam.shake = 0;
  camera.position.copy(cam.pos); camera.lookAt(cam.look);
}

/* Camera rigs, cycled with C. One fixed chase angle is most of what makes a
   driving game read as a tech demo — being able to drop to bonnet height or
   pull out to a drone shot is what people actually screenshot. */
const CAMS = [
  { id:'chase', name:'CHASE',     dist: 6.7, high:2.28, lead:16, fov:60, tilt:1.00 },
  { id:'far',   name:'WIDE',      dist:11.4, high:4.35, lead:27, fov:52, tilt:0.65 },
  { id:'near',  name:'CLOSE',     dist: 5.7, high:1.98, lead:14, fov:64, tilt:1.25 },
  { id:'hood',  name:'HOOD',      dist: 0,   high:1.14, lead:34, fov:70, tilt:1.35 },
  { id:'orbit', name:'CINEMATIC', dist: 8.6, high:2.55, lead: 0, fov:44, tilt:0.00 },
];
let camMode = 0, orbitAz = 0, camTagT = null;
/** Brief centred caption. Doubles as the only feedback the settings keys give,
    which keeps the HUD to the three readouts the brief asks for. */
function toast(text){
  const el = document.getElementById('camTag');
  if(!el) return;
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(camTagT);
  camTagT = setTimeout(()=>el.classList.remove('show'), 1300);
}
function camFlash(){ toast(CAMS[camMode].name); }

function updateCamera(dt){
  const M = CAMS[camMode];
  const spd = Math.abs(car.vLong);
  const spdN = clamp(spd/72, 0, 1);
  const b = car.boostAmt;

  if(M.id === 'hood'){ hoodCam(dt, spdN, b); return; }
  if(M.id === 'orbit'){ orbitCam(dt, spdN, b); return; }

  // desired anchor: behind the car in the direction of travel, blended w/ body yaw
  const f = frameAt(car.s);
  const travelYaw = car.yaw - Math.atan2(car.vLat, Math.max(3, car.vLong))*0.55;
  const worldYaw  = f.h + travelYaw;

  let dist = M.dist + spdN*2.3 + b*3.0;
  const high = M.high + spdN*0.42 + b*0.24;

  roadToWorld(car.s, car.n, _cp);
  const cx = Math.cos(worldYaw), sx = Math.sin(worldYaw);
  /* Camera collision. When the road drops into a cutting the ground behind the
     car is a bank, and lifting the rig over it turns the shot into a
     helicopter view looking down at a roof — which is the single fastest way
     to lose the sense of speed. Pull in along the boom instead: a close chase
     shot still reads as a chase shot. */
  for(let i=0;i<4;i++){
    if(groundYAt(_cp.x - sx*dist, _cp.z - cx*dist) + 1.0 <= car.y + high) break;
    dist *= 0.78;
    if(dist < M.dist*0.42){ dist = M.dist*0.42; break; }
  }
  _ct.set(_cp.x - sx*dist, car.y + high, _cp.z - cx*dist);

  // Velocity of the anchor itself. Damping the *relative* velocity means the
  // rig sits at the right distance while cruising and only slips back when the
  // car actually accelerates — which is the lag we want, not a constant offset.
  if(!cam.init){ _ctPrev.copy(_ct); cam.init = true; }
  _anchorVel.copy(_ct).sub(_ctPrev).divideScalar(Math.max(dt,1e-4));
  _ctPrev.copy(_ct);
  if(_anchorVel.lengthSq() > 40000) _anchorVel.set(0,0,0);   // teleport guard

  const k  = 34 + spdN*14;
  const dmp = 2*Math.sqrt(k)*0.95;
  _tmp.copy(_ct).sub(cam.pos).multiplyScalar(k);
  _relVel.copy(cam.vel).sub(_anchorVel);
  _tmp.addScaledVector(_relVel, -dmp);
  cam.vel.addScaledVector(_tmp, dt);
  cam.pos.addScaledVector(cam.vel, dt);

  // never let the camera clip into the ground, but don't let a cliff behind the
  // car shove the rig into a helicopter shot either
  const gy = groundYAt(cam.pos.x, cam.pos.z) + 0.95;
  if(cam.pos.y < gy){ cam.pos.y = gy; cam.vel.y = Math.max(cam.vel.y, 0); }
  // tight ceiling: the boom now dollies in rather than climbing, so anything
  // much above the nominal height is a bug rather than a shot
  const yLo = car.y + 0.85, yHi = car.y + high + 1.7;
  if(cam.pos.y < yLo){ cam.pos.y = yLo; cam.vel.y = Math.max(cam.vel.y, 0); }
  if(cam.pos.y > yHi){ cam.pos.y = yHi; cam.vel.y = Math.min(cam.vel.y, 0); }

  // look target: ahead of the car along the road
  const lead = M.lead + spdN*24 + b*13;
  roadToWorld(car.s + lead, car.n*0.55, _tmp);
  _tmp.y += 1.55;
  cam.look.lerp(_tmp, 1-Math.exp(-9*dt));

  camera.position.copy(cam.pos);
  camera.up.set(0,1,0);
  camera.lookAt(cam.look);

  // bank into the turn + drift
  const latG = clamp((car.omega*Math.max(spd,1))/13, -1, 1);
  const targetRoll = (-latG*0.10 - clamp(car.vLat/26,-0.5,0.5)*0.10) * M.tilt;
  cam.roll = damp(cam.roll, targetRoll, 5.5, dt);
  camera.rotateZ(cam.roll);

  // shake
  const shakeAmt = spdN*spdN*0.34 + b*0.42 + car.rough*0.55 + car.landImpact*1.4 + car.screech*0.16;
  cam.shake = damp(cam.shake, shakeAmt, 12, dt);
  if(cam.shake > 0.001){
    const t = clock*37;
    camera.rotateX((vnoise(t,1.7))*0.0042*cam.shake);
    camera.rotateY((vnoise(t*1.13,9.3))*0.0048*cam.shake);
    camera.rotateZ((vnoise(t*0.87,4.1))*0.0035*cam.shake);
  }

  // past ~76° the barrel distortion reads as fisheye rather than speed
  const fovT = M.fov + spdN*6.0 + b*9.5 + car.screech*1.8;
  cam.fov = damp(cam.fov, fovT, 4.2, dt);
  if(Math.abs(camera.fov-cam.fov)>0.01){ camera.fov=cam.fov; camera.updateProjectionMatrix(); }
}

/** Bonnet cam. Rigidly attached — a spring rig here reads as a loose camera
    bolted to the car rather than as the driver's own point of view. */
function hoodCam(dt, spdN, b){
  const M = CAMS[camMode];
  const f = frameAt(car.s);
  const wy = f.h + car.yaw;
  roadToWorld(car.s, car.n, _cp);
  const fwd = 1.05;
  cam.pos.set(_cp.x + Math.sin(wy)*fwd, car.y + M.high + car.ride*0.5, _cp.z + Math.cos(wy)*fwd);
  camera.position.copy(cam.pos);
  camera.up.set(0,1,0);
  roadToWorld(car.s + M.lead + spdN*26, car.n*0.5, _tmp); _tmp.y += 1.1;
  cam.look.lerp(_tmp, 1-Math.exp(-14*dt));
  camera.lookAt(cam.look);
  cam.roll = damp(cam.roll, (car.roll*1.5 + clamp(car.vLat/24,-0.5,0.5)*-0.10)*M.tilt, 8, dt);
  camera.rotateZ(cam.roll);
  camera.rotateX(-car.pitch*0.7);
  const fovT = M.fov + spdN*5.0 + b*8.0;
  cam.fov = damp(cam.fov, fovT, 5.0, dt);
  camera.fov = cam.fov; camera.updateProjectionMatrix();
  cam.vel.set(0,0,0); _ctPrev.copy(cam.pos);
}

/** Slow drone orbit — the shot you leave running while the sun goes down.
    Flown in road coordinates and kept over the tarmac on purpose: in the dense
    sections trunks stand within 8 m of the centreline and their crowns overhang
    it, so a free world-space orbit spends half its arc inside a canopy. */
function orbitCam(dt, spdN, b){
  const M = CAMS[camMode];
  orbitAz += dt*0.20;
  const back = 4.9 + (Math.sin(orbitAz*0.73)*0.5+0.5)*4.4;
  const side = Math.sin(orbitAz)*6.1;
  const h    = 1.70 + (Math.sin(orbitAz*0.51)*0.5+0.5)*1.55;
  roadToWorld(car.s, car.n, _cp);
  roadToWorld(car.s - back, clamp(car.n + side, -7.2, 7.2), _ct);
  _ct.y = car.y + h;
  cam.pos.lerp(_ct, 1-Math.exp(-5*dt));
  const gy = groundYAt(cam.pos.x, cam.pos.z) + 0.85;
  if(cam.pos.y < gy) cam.pos.y = gy;
  camera.position.copy(cam.pos);
  camera.up.set(0,1,0);
  _tmp.set(_cp.x, car.y + 0.70, _cp.z);
  cam.look.lerp(_tmp, 1-Math.exp(-8*dt));
  camera.lookAt(cam.look);
  cam.roll = damp(cam.roll, 0, 4, dt);
  cam.fov = damp(cam.fov, M.fov + spdN*4.0 + b*4.0, 4, dt);
  camera.fov = cam.fov; camera.updateProjectionMatrix();
  cam.vel.set(0,0,0); _ctPrev.copy(cam.pos);
}
/** Fixed beauty-shot rig used by the capture harness to review the car itself. */
let camLock = null;
function applyCamLock(){
  if(!camLock) return;
  const f = frameAt(car.s);
  roadToWorld(car.s, car.n, _cp);
  const yaw = f.h + car.yaw + camLock.az;
  const d = camLock.dist;
  camera.position.set(_cp.x - Math.sin(yaw)*d, car.y + camLock.height, _cp.z - Math.cos(yaw)*d);
  camera.up.set(0,1,0);
  camera.lookAt(_cp.x, car.y + (camLock.aim===undefined?0.62:camLock.aim), _cp.z);
  camera.fov = camLock.fov || 42; camera.updateProjectionMatrix();
}

function groundYAt(x,z){
  const q = nearestRoad(x,z,26);
  if(q.d < 12) return q.y;
  return terrainHeight(x,z);
}

/*═══════════════════════════════════════════════════════════════════════════
  14 · PARTICLES · TYRE MARKS · SPEED FX
═══════════════════════════════════════════════════════════════════════════*/
/* tyre marks: two ribbons, ring-buffered */
const TRAIL_SEG = 190;
const trailMat = new THREE.MeshBasicMaterial({
  color:0x11100f, transparent:true, opacity:0.62, depthWrite:false,
  polygonOffset:true, polygonOffsetFactor:-6, polygonOffsetUnits:-6, fog:true });
const trails = [];
for(let w=0;w<2;w++){
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array((TRAIL_SEG+1)*2*3);
  const alp = new Float32Array((TRAIL_SEG+1)*2);
  const idx = [];
  for(let i=0;i<TRAIL_SEG;i++){
    const a=i*2, b=a+1, c=a+2, d=a+3;
    idx.push(a,c,b, b,c,d);
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('aAlpha', new THREE.BufferAttribute(alp,1));
  g.setIndex(idx);
  g.setDrawRange(0,0);
  const m = trailMat.clone();
  m.onBeforeCompile = fogPatch(sh=>{
    sh.vertexShader='attribute float aAlpha; varying float vA;\n'+sh.vertexShader
      .replace('#include <begin_vertex>','#include <begin_vertex>\n vA=aAlpha;');
    sh.fragmentShader='varying float vA;\n'+sh.fragmentShader
      .replace('#include <opaque_fragment>','diffuseColor.a *= vA;\n#include <opaque_fragment>');
  });
  m.customProgramCacheKey=()=>'trail';
  const mesh = new THREE.Mesh(g,m);
  mesh.frustumCulled=false; mesh.renderOrder=2;
  scene.add(mesh);
  trails.push({mesh, g, pos, alp, head:0, count:0, last:null});
}
function trailReset(){
  for(const t of trails){ t.head=0; t.count=0; t.last=null; t.alp.fill(0); t.g.setDrawRange(0,0); }
}
function trailPush(ti, p, right, strength){
  const t = trails[ti];
  const i = t.head;
  const hw = 0.13;
  const o = i*6;
  t.pos[o]=p.x-right.x*hw; t.pos[o+1]=p.y+0.012; t.pos[o+2]=p.z-right.z*hw;
  t.pos[o+3]=p.x+right.x*hw; t.pos[o+4]=p.y+0.012; t.pos[o+5]=p.z+right.z*hw;
  t.alp[i*2]=strength; t.alp[i*2+1]=strength;
  t.head = (t.head+1) % (TRAIL_SEG+1);
  t.count = Math.min(t.count+1, TRAIL_SEG);
  // break the ribbon at the wrap point
  const nx = t.head;
  t.alp[nx*2]=0; t.alp[nx*2+1]=0;
  t.g.attributes.position.needsUpdate=true;
  t.g.attributes.aAlpha.needsUpdate=true;
  t.g.setDrawRange(0, TRAIL_SEG*6);
}
function trailFade(dt){
  for(const t of trails){
    let any=false;
    for(let i=0;i<t.alp.length;i++){
      if(t.alp[i]>0){ t.alp[i]=Math.max(0,t.alp[i]-dt*0.055); any=true; }
    }
    if(any) t.g.attributes.aAlpha.needsUpdate=true;
  }
}

/* dust / spark particles */
const PN = 900;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(PN*3), pCol = new Float32Array(PN*3), pSize = new Float32Array(PN);
const pVel = new Float32Array(PN*3), pLife = new Float32Array(PN), pMax = new Float32Array(PN);
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos,3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pCol,3));
pGeo.setAttribute('aSize', new THREE.BufferAttribute(pSize,1));
pGeo.setAttribute('aLife', new THREE.BufferAttribute(pLife,1));
const pMat = new THREE.ShaderMaterial({
  uniforms:{ uTex:{value:softSprite}, uPix:{value:1} },
  transparent:true, depthWrite:false, blending:THREE.NormalBlending, vertexColors:true,
  vertexShader:`attribute float aSize; attribute float aLife; varying vec3 vC; varying float vL;
    uniform float uPix;
    void main(){ vC=color; vL=aLife;
      vec4 mv=modelViewMatrix*vec4(position,1.0);
      gl_Position=projectionMatrix*mv;
      // uncapped point sizes turn a near-camera dust mote into a screen blob
      gl_PointSize = clamp(aSize*uPix / max(-mv.z, 2.4) * 260.0, 1.0, 58.0*uPix); }`,
  fragmentShader:`uniform sampler2D uTex; varying vec3 vC; varying float vL;
    void main(){ float a=texture2D(uTex,gl_PointCoord).a;
      if(vL<=0.0) discard;
      gl_FragColor=vec4(vC, a*vL*0.62); }`
});
const points = new THREE.Points(pGeo,pMat);
points.frustumCulled=false; scene.add(points);
let pHead=0;
function emit(x,y,z, vx,vy,vz, size, life, col){
  const i=pHead; pHead=(pHead+1)%PN;
  pPos[i*3]=x; pPos[i*3+1]=y; pPos[i*3+2]=z;
  pVel[i*3]=vx; pVel[i*3+1]=vy; pVel[i*3+2]=vz;
  pSize[i]=size; pLife[i]=1; pMax[i]=life;
  pCol[i*3]=col.r; pCol[i*3+1]=col.g; pCol[i*3+2]=col.b;
}
function stepParticles(dt){
  for(let i=0;i<PN;i++){
    if(pLife[i]<=0) continue;
    pLife[i] -= dt/pMax[i];
    if(pLife[i]<0) pLife[i]=0;
    pPos[i*3]   += pVel[i*3]*dt;
    pPos[i*3+1] += pVel[i*3+1]*dt;
    pPos[i*3+2] += pVel[i*3+2]*dt;
    pVel[i*3]   *= (1-1.5*dt);
    pVel[i*3+1] += (0.55 - 2.0*dt)*dt;
    pVel[i*3+2] *= (1-1.5*dt);
    pSize[i]    += dt*1.5;
  }
  pGeo.attributes.position.needsUpdate=true;
  pGeo.attributes.aLife.needsUpdate=true;
  pGeo.attributes.aSize.needsUpdate=true;
  pGeo.attributes.color.needsUpdate=true;
}

/*═══════════════════════════════════════════════════════════════════════════
  15 · POST-PROCESSING
═══════════════════════════════════════════════════════════════════════════*/
const _H = (location.hash||'').toLowerCase();
const rtParams = { type: THREE.HalfFloatType, samples: _H.includes('nomsaa') ? 0 : 4 };
/* Size every buffer from the canvas' own *integer* drawing buffer, never from
   cssSize × devicePixelRatio. At 120% display scaling that product is
   fractional, and ANGLE/D3D11 resolves a multisampled target with
   blitFramebuffer — mismatched source/destination rects put the resolved frame
   in a corner of the canvas and leave the rest black. */
const composerRT = new THREE.WebGLRenderTarget(
  renderer.domElement.width, renderer.domElement.height, rtParams);
const composer = new EffectComposer(renderer, composerRT);
composer.setPixelRatio(1);
const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);

/* ---- god rays ---- */
class GodRaysPass extends Pass {
  constructor(w,h){
    super();
    const o = { type:THREE.HalfFloatType, depthBuffer:false, stencilBuffer:false };
    this.rtA = new THREE.WebGLRenderTarget(Math.max(2,w>>2), Math.max(2,h>>2), o);
    this.rtB = new THREE.WebGLRenderTarget(Math.max(2,w>>2), Math.max(2,h>>2), o);
    const vs = `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`;
    this.prep = new THREE.ShaderMaterial({ uniforms:{
        tDiffuse:{value:null}, uSun:{value:new THREE.Vector2(0.5,0.5)}, uThr:{value:3.6} },
      vertexShader:vs, fragmentShader:`
        uniform sampler2D tDiffuse; uniform vec2 uSun; uniform float uThr; varying vec2 vUv;
        void main(){
          vec3 c = texture2D(tDiffuse, vUv).rgb;
          float l = dot(c, vec3(0.2126,0.7152,0.0722));
          float m = smoothstep(uThr, uThr*2.4, l);
          float d = distance(vUv, uSun);
          m *= 1.0 - smoothstep(0.06, 0.85, d);
          gl_FragColor = vec4(c*m, 1.0);
        }`});
    this.blur = new THREE.ShaderMaterial({ uniforms:{
        tDiffuse:{value:null}, uSun:{value:new THREE.Vector2(0.5,0.5)},
        uDensity:{value:0.62}, uDecay:{value:0.94}, uStride:{value:1.0} },
      vertexShader:vs, fragmentShader:`
        uniform sampler2D tDiffuse; uniform vec2 uSun;
        uniform float uDensity, uDecay, uStride; varying vec2 vUv;
        const int N = 14;
        void main(){
          vec2 dlt = (vUv - uSun) * (uDensity / float(N)) * uStride;
          vec2 uv = vUv; float w = 1.0; vec3 acc = vec3(0.0); float sum = 0.0;
          for(int i=0;i<N;i++){
            acc += texture2D(tDiffuse, uv).rgb * w;
            sum += w; uv -= dlt; w *= uDecay;
          }
          gl_FragColor = vec4(acc/max(sum,0.0001), 1.0);
        }`});
    this.comp = new THREE.ShaderMaterial({ uniforms:{
        tDiffuse:{value:null}, tRays:{value:null},
        uStrength:{value:0.9}, uTint:{value:new THREE.Color(1,0.72,0.42)} },
      vertexShader:vs, fragmentShader:`
        uniform sampler2D tDiffuse, tRays; uniform float uStrength; uniform vec3 uTint;
        varying vec2 vUv;
        void main(){
          vec3 base = texture2D(tDiffuse, vUv).rgb;
          vec3 rays = texture2D(tRays,    vUv).rgb;
          gl_FragColor = vec4(base + rays*uTint*uStrength, 1.0);
        }`});
    this.fsq = new FullScreenQuad(this.prep);
  }
  setSize(w,h){ this.rtA.setSize(Math.max(2,w>>2),Math.max(2,h>>2)); this.rtB.setSize(Math.max(2,w>>2),Math.max(2,h>>2)); }
  render(renderer, writeBuffer, readBuffer){
    if(this.comp.uniforms.uStrength.value < 0.004){
      // pass-through
      this.fsq.material = this.comp;
      this.comp.uniforms.tDiffuse.value = readBuffer.texture;
      this.comp.uniforms.tRays.value = this.rtA.texture;
    } else {
      this.prep.uniforms.tDiffuse.value = readBuffer.texture;
      this.fsq.material = this.prep;
      renderer.setRenderTarget(this.rtA); renderer.clear(); this.fsq.render(renderer);

      this.fsq.material = this.blur;
      this.blur.uniforms.tDiffuse.value = this.rtA.texture;
      this.blur.uniforms.uStride.value = 1.0;
      renderer.setRenderTarget(this.rtB); renderer.clear(); this.fsq.render(renderer);

      this.blur.uniforms.tDiffuse.value = this.rtB.texture;
      this.blur.uniforms.uStride.value = 14.0;
      renderer.setRenderTarget(this.rtA); renderer.clear(); this.fsq.render(renderer);

      this.comp.uniforms.tDiffuse.value = readBuffer.texture;
      this.comp.uniforms.tRays.value = this.rtA.texture;
      this.fsq.material = this.comp;
    }
    renderer.setRenderTarget(this.renderToScreen ? null : writeBuffer);
    if(this.clear) renderer.clear();
    this.fsq.render(renderer);
  }
}
const godRays = new GodRaysPass(innerWidth, innerHeight);
composer.addPass(godRays);

const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), 0.72, 0.62, 0.72);
composer.addPass(bloom);

composer.addPass(new OutputPass());

/* ---- final composite: grade + blur + CA + grain + vignette + speed lines ---- */
const CompositeShader = {
  uniforms:{
    tDiffuse:{value:null},
    uTime:{value:0}, uRes:{value:new THREE.Vector2(1,1)},
    uBlur:{value:0}, uCA:{value:0.0016}, uGrain:{value:0.030},
    uVign:{value:0.62}, uSat:{value:1.06}, uContrast:{value:1.18},
    uLift:{value:new THREE.Vector3(0.002,0.003,0.007)},
    uGain:{value:new THREE.Vector3(1,1,1)},
    uShad:{value:new THREE.Vector3(1,1,1)},
    uLines:{value:0}, uFlash:{value:0},
  },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`
    uniform sampler2D tDiffuse;
    uniform float uTime, uBlur, uCA, uGrain, uVign, uSat, uContrast, uLines, uFlash;
    uniform vec2 uRes; uniform vec3 uLift, uGain, uShad;
    varying vec2 vUv;
    float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    void main(){
      vec2 dir = vUv - 0.5;
      float d = length(dir);

      // chromatic aberration, edge weighted
      float ca = uCA * d * d * 3.4;
      vec3 col;
      col.r = texture2D(tDiffuse, vUv - dir*ca).r;
      col.g = texture2D(tDiffuse, vUv         ).g;
      col.b = texture2D(tDiffuse, vUv + dir*ca).b;

      // radial speed blur (centre stays sharp)
      if(uBlur > 0.0012){
        float amt = uBlur * smoothstep(0.04, 0.78, d);
        vec3 acc = col; float sum = 1.0;
        for(int i=1;i<8;i++){
          float t = float(i)/7.0;
          float w = 1.0 - t*0.62;
          acc += texture2D(tDiffuse, vUv - dir*(t*amt)).rgb * w;
          sum += w;
        }
        col = acc/sum;
      }

      // ---- grade: saturation → split tone → contrast → shoulder ----
      float l = dot(col, vec3(0.2126,0.7152,0.0722));
      col = mix(vec3(l), col, uSat);
      // warm the highlights, cool the shadows (never a flat tint over everything)
      col *= mix(uShad, uGain, smoothstep(0.06, 0.68, l));
      col = (col - 0.5)*uContrast + 0.5;
      col += uLift*(1.0 - smoothstep(0.0, 0.55, l));
      // pull the black point down: ambient fill was leaving nothing below ~0.1
      // and a frame with no true darks always reads as washed out
      col = max(col - 0.014, 0.0) / (1.0 - 0.014);
      col = clamp(col, 0.0, 4.0);
      col = mix(col, col*col*(3.0-2.0*col), 0.34);

      // speed lines
      if(uLines > 0.002){
        float a = atan(dir.y, dir.x);
        float seed = floor(a*34.0);
        float rnd = h21(vec2(seed, 3.0));
        float m = fract(rnd*7.31 + uTime*1.9 - d*1.25);
        float streak = smoothstep(0.52, 1.0, d) * step(0.63, rnd);
        streak *= smoothstep(0.0,0.22,m)*smoothstep(1.0,0.55,m);
        col += vec3(1.0,0.93,0.84) * streak * uLines * 0.42;
      }

      // vignette
      col *= mix(1.0, smoothstep(0.95, 0.26, d), uVign);

      // grain
      float g = h21(vUv*uRes + uTime*131.0);
      col += (g-0.5)*uGrain*(1.0 - 0.55*l);

      col = mix(col, vec3(1.0), uFlash);
      gl_FragColor = vec4(col, 1.0);
    }`
};
const compositePass = new ShaderPass(CompositeShader);
composer.addPass(compositePass);

/*═══════════════════════════════════════════════════════════════════════════
  16 · AUDIO (procedural, Web Audio)
═══════════════════════════════════════════════════════════════════════════*/
const AUD = { ctx:null, ready:false };
function initAudio(){
  if(AUD.ctx) return;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if(!Ctx) return;
  const ctx = new Ctx();
  AUD.ctx = ctx;

  const master = ctx.createGain(); master.gain.value = 0.0; master.connect(ctx.destination);
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value=-14; comp.knee.value=22; comp.ratio.value=8;
  comp.attack.value=0.004; comp.release.value=0.22;
  comp.connect(master);
  AUD.master = master;

  /* ---- engine: harmonic stack through a resonant filter ---- */
  const engGain = ctx.createGain(); engGain.gain.value=0;
  const engFilt = ctx.createBiquadFilter();
  engFilt.type='lowpass'; engFilt.frequency.value=760; engFilt.Q.value=2.2;
  const growl = ctx.createBiquadFilter();
  growl.type='peaking'; growl.frequency.value=180; growl.Q.value=1.6; growl.gain.value=9;
  engGain.connect(growl); growl.connect(engFilt); engFilt.connect(comp);

  const oscs=[];
  const harm=[[0.5,0.32,'sawtooth'],[1,0.5,'sawtooth'],[2,0.26,'square'],[3,0.14,'sawtooth'],[4.5,0.08,'square']];
  for(const [mul,amp,type] of harm){
    const o=ctx.createOscillator(); o.type=type;
    const g=ctx.createGain(); g.gain.value=amp;
    o.connect(g); g.connect(engGain); o.start();
    oscs.push({o,mul});
  }
  AUD.eng={gain:engGain, filt:engFilt, oscs, growl};

  /* ---- noise buffer ---- */
  const nb = ctx.createBuffer(1, ctx.sampleRate*3, ctx.sampleRate);
  const nd = nb.getChannelData(0);
  for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
  function noiseSrc(){ const s=ctx.createBufferSource(); s.buffer=nb; s.loop=true; s.start(); return s; }

  /* ---- intake / induction ---- */
  const indG=ctx.createGain(); indG.gain.value=0;
  const indF=ctx.createBiquadFilter(); indF.type='bandpass'; indF.frequency.value=420; indF.Q.value=1.1;
  noiseSrc().connect(indF); indF.connect(indG); indG.connect(comp);
  AUD.ind={g:indG,f:indF};

  /* ---- wind ---- */
  const wG=ctx.createGain(); wG.gain.value=0;
  const wF=ctx.createBiquadFilter(); wF.type='lowpass'; wF.frequency.value=500; wF.Q.value=0.6;
  const wH=ctx.createBiquadFilter(); wH.type='highpass'; wH.frequency.value=180;
  noiseSrc().connect(wH); wH.connect(wF); wF.connect(wG); wG.connect(comp);
  AUD.wind={g:wG,f:wF};

  /* ---- tyre roar ---- */
  const tG=ctx.createGain(); tG.gain.value=0;
  const tF=ctx.createBiquadFilter(); tF.type='bandpass'; tF.frequency.value=240; tF.Q.value=0.9;
  noiseSrc().connect(tF); tF.connect(tG); tG.connect(comp);
  AUD.tyre={g:tG,f:tF};

  /* ---- screech ---- */
  const sG=ctx.createGain(); sG.gain.value=0;
  const sF=ctx.createBiquadFilter(); sF.type='bandpass'; sF.frequency.value=1750; sF.Q.value=7.5;
  const sF2=ctx.createBiquadFilter(); sF2.type='bandpass'; sF2.frequency.value=3100; sF2.Q.value=11;
  const n=noiseSrc(); n.connect(sF); n.connect(sF2);
  sF.connect(sG); sF2.connect(sG); sG.connect(comp);
  AUD.scr={g:sG,f:sF,f2:sF2};

  /* ---- ambience: night crickets / day birds ---- */
  const aG=ctx.createGain(); aG.gain.value=0;          // level
  const aTrem=ctx.createGain(); aTrem.gain.value=0.5;  // chirp envelope, 0…1
  const aF=ctx.createBiquadFilter(); aF.type='bandpass'; aF.frequency.value=2400; aF.Q.value=3.5;
  const aLfo=ctx.createOscillator(); aLfo.type='sine'; aLfo.frequency.value=7.4;
  const aLg=ctx.createGain(); aLg.gain.value=0.5;
  // the LFO must modulate a stage *before* the level control — summed onto the
  // level itself it would swing the ambience to full scale at any speed
  aLfo.connect(aLg); aLg.connect(aTrem.gain); aLfo.start();
  noiseSrc().connect(aF); aF.connect(aTrem); aTrem.connect(aG); aG.connect(comp);
  AUD.amb={g:aG,f:aF,lfo:aLfo};

  AUD.ready=true;
  AUD.comp = comp;
  master.gain.setTargetAtTime(0.85, ctx.currentTime, 1.2);
}
function boostWhoosh(){
  if(!AUD.ready) return;
  const ctx=AUD.ctx, t=ctx.currentTime;
  const nb=ctx.createBufferSource();
  const buf=ctx.createBuffer(1, ctx.sampleRate*1.1, ctx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1);
  nb.buffer=buf;
  const f=ctx.createBiquadFilter(); f.type='bandpass'; f.Q.value=1.4;
  f.frequency.setValueAtTime(240,t);
  f.frequency.exponentialRampToValueAtTime(4200,t+0.55);
  const g=ctx.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.42,t+0.07);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.95);
  nb.connect(f); f.connect(g); g.connect(AUD.comp);
  nb.start(t); nb.stop(t+1.05);
}
function thumpSound(power){
  if(!AUD.ready || power<0.12) return;
  const ctx=AUD.ctx,t=ctx.currentTime;
  const o=ctx.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(38,t+0.22);
  const g=ctx.createGain();
  g.gain.setValueAtTime(Math.min(0.6,power*0.7),t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.3);
  o.connect(g); g.connect(AUD.comp); o.start(t); o.stop(t+0.32);
}
function updateAudio(dt){
  if(!AUD.ready) return;
  const ctx=AUD.ctx, T=ctx.currentTime, k=0.06;
  const spd=Math.abs(car.vLong), spdN=clamp(spd/72,0,1);
  const rpmN = clamp((car.rpm-850)/7750, 0, 1);
  const base = 34 + rpmN*118;
  for(const {o,mul} of AUD.eng.oscs) o.frequency.setTargetAtTime(base*mul, T, k);
  const load = clamp(input.th*0.8 + car.boostAmt*0.4 + rpmN*0.35, 0, 1);
  AUD.eng.gain.gain.setTargetAtTime(0.10 + load*0.20, T, k);
  AUD.eng.filt.frequency.setTargetAtTime(520 + rpmN*3400 + load*900, T, k);
  AUD.eng.growl.gain.setTargetAtTime(6 + load*10, T, k);
  AUD.ind.g.gain.setTargetAtTime(load*0.075 + car.boostAmt*0.10, T, k);
  AUD.ind.f.frequency.setTargetAtTime(380+rpmN*1500, T, k);

  AUD.wind.g.gain.setTargetAtTime(Math.pow(spdN,1.7)*0.30, T, 0.10);
  AUD.wind.f.frequency.setTargetAtTime(340+spdN*2400, T, 0.10);

  AUD.tyre.g.gain.setTargetAtTime(spdN*0.11*(1+car.offroad*1.7), T, 0.10);
  AUD.tyre.f.frequency.setTargetAtTime(160+spdN*420+car.offroad*300, T, 0.10);

  AUD.scr.g.gain.setTargetAtTime(car.screech*0.20, T, 0.05);
  AUD.scr.f.frequency.setTargetAtTime(1500+car.screech*900+Math.sin(T*9)*120, T, 0.05);

  const night = SKYST.star;
  AUD.amb.g.gain.setTargetAtTime((1-spdN)*(1-spdN)*0.16, T, 0.4);
  AUD.amb.f.frequency.setTargetAtTime(night>0.4 ? 4200 : 2100, T, 0.6);
  AUD.amb.lfo.frequency.setTargetAtTime(night>0.4 ? 11 : 3.1, T, 0.6);
}

/*═══════════════════════════════════════════════════════════════════════════
  17 · INPUT
═══════════════════════════════════════════════════════════════════════════*/
let started=false;
const startEl = document.getElementById('start');
const hudEl   = document.getElementById('flash');
function beginGame(){
  if(started) return;
  started=true;
  initAudio();
  if(AUD.ctx && AUD.ctx.state==='suspended') AUD.ctx.resume();
  startEl.classList.add('hide');
  document.getElementById('hud').classList.add('on');
  setTimeout(()=>{ startEl.style.display='none'; }, 1400);
}
addEventListener('keydown', e=>{
  KEYS_DOWN[e.code]=true;
  if(e.code==='F3'){ dbgOpen(); e.preventDefault(); return; }
  if(!started){ beginGame(); e.preventDefault(); return; }
  if(e.code==='KeyR') doRestart();
  if(e.code==='KeyC'){ camMode = (camMode+1) % CAMS.length; cam.init=false; camFlash(); }
  if(e.code==='KeyV'){
    fpsCap = FPSCAPS[(FPSCAPS.indexOf(fpsCap)+1) % FPSCAPS.length];
    frameDebt = 0; toast(capLabel());
  }
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e=>{ KEYS_DOWN[e.code]=false; });
addEventListener('pointerdown', ()=>{ if(!started) beginGame(); });
addEventListener('blur', ()=>{ for(const k in KEYS_DOWN) KEYS_DOWN[k]=false; });

function readInput(dt){
  if(autoDrive){ autopilot(); return; }
  const K=KEYS_DOWN;
  const up   = K['KeyW']||K['ArrowUp'];
  const down = K['KeyS']||K['ArrowDown'];
  const left = K['KeyA']||K['ArrowLeft'];
  const right= K['KeyD']||K['ArrowRight'];
  input.th = damp(input.th, up?1:0, 9, dt);
  input.br = damp(input.br, down?1:0, 13, dt);

  /* A key is a switch and a steering wheel is not, so the whole feel of the car
     lives in how one becomes the other. Three rates, because the three motions
     want different things: winding lock on is deliberate and gets slower with
     speed so a tap at 200 km/h does not throw the car; letting go snaps back to
     straight, which is what makes the car feel like it wants to go where it is
     pointed; and crossing the centre is quickest of all, so a flick of
     opposite lock actually arrives in time to catch a slide. */
  const stT = (left?-1:0)+(right?1:0);
  const rate = stT === 0            ? 10.0
             : stT*input.st < -0.02 ? 15.0
             : 6.4 - Math.min(Math.abs(car.vLong)*0.032, 2.9);
  input.st = damp(input.st, stT, rate, dt);
  input.hb = K['Space']?1:0;
  const bo = !!(K['ShiftLeft']||K['ShiftRight']);
  if(bo && !input.bo && car.boost>0.05) boostWhoosh();
  input.bo = bo;
}

/** Attract/capture autopilot: pure-pursuit lane hold with corner-speed lookahead.
    Aiming at a point on the centreline (rather than nulling heading alone)
    corrects lateral offset too, otherwise the drive slowly wanders off-road. */
let autoDrive = false;
function autopilot(){
  const spd = Math.abs(car.vLong);
  /* Look-ahead grows with lateral error as well as with speed. Aiming at a
     point thirteen metres up the road while sitting twenty metres out in a
     field demands a sixty-degree heading change, which no car can take
     smoothly — it just pirouettes on full lock. Pushing the aim point out
     turns the recovery into an arc back onto the tarmac. */
  const L = clamp(spd*0.90 + 11 + Math.abs(car.n)*0.95, 13, 72);
  // heading that points at the centreline L metres ahead, in road-frame terms
  let err = Math.atan2(-car.n, L) - car.yaw;
  err = Math.atan2(Math.sin(err), Math.cos(err));
  const yawRoad = car.omega - curvatureAt(car.s)*car.vLong;   // rate vs the road
  /* Everything is worked out as a steering angle in radians and only divided
     by the limiter at the end. Composing normalised commands instead meant the
     feed-forward silently changed meaning whenever the limiter did. */
  // Pure pursuit is exact for a car that goes exactly where it is pointed;
  // a real one needs the understeer gradient's worth of extra lock on top,
  // and without it the correction is roughly half of what the error needs.
  const ppA   = Math.atan2(2*WB*Math.sin(err), L) * (WB + KUS*spd*spd)/WB;
  const ffA   = steerForCurve(curvatureAt(car.s + spd*0.55), spd);
  const dampA = -yawRoad*0.42*(WB + KUS*spd*spd)/Math.max(spd, 8);
  input.st = clamp((ppA + ffA + dampA)/steerCapAt(spd), -1, 1);

  // scan as far ahead as it would take to actually stop for the corner,
  // otherwise a hairpin is already unavoidable by the time it's detected
  const scan = clamp(spd*spd/16 + 40, 60, 420);
  let over = -99;
  for(let i=1;i<=14;i++){
    const ds = scan*i/14;
    const kk = Math.abs(curvatureAt(car.s + ds));
    // 6.0 m/s² of lateral budget, not the ~13 the tyres can hold: at the limit
    // there is nothing left to correct a line error with, and the drive spends
    // the corner in the dirt instead of on the road
    const vC = clamp(Math.sqrt(5.5/Math.max(kk,1e-5)), 14, 44);
    /* Speed we may carry now and still bleed to vC by then, at 5.5 m/s². The
       old figure of 8 assumed the brakes could be used at full force through a
       corner, which stopped being true the moment braking and cornering began
       sharing one friction budget — so the plan was always feasible on paper
       and never on the road, and every corner was entered a beat too fast. */
    over = Math.max(over, spd - Math.sqrt(vC*vC + 2*5.5*ds));
  }
  // ease off well before the margin is gone rather than staying flat until it is
  input.th = clamp(-over*0.24, 0, 1) * clamp(1 - Math.abs(err)*1.1, 0.25, 1);
  input.br = clamp(over*0.45, 0, 0.9);

  /* Recovery. Once a wheel is on the grass the lane-keeper's gains — tuned for
     nudges of a metre or two — are far too gentle to climb back, and the drive
     spends the rest of its life in a ditch. Off the road, slow right down and
     steer hard for the centreline. */
  const lost = smooth(8, 20, Math.abs(car.n));
  if(lost > 0.01){
    input.st = clamp(input.st + err*1.1*lost, -1, 1);
    input.br = Math.max(input.br, lost*0.45*smooth(14, 30, spd));
    input.th = Math.max(0.30, Math.min(input.th, 1 - lost*0.45));
  }
  /* Unwind when the rear is genuinely gone. Holding lock into a slide is how a
     spin becomes a pirouette, and the recovery gains above are more than
     capable of getting there on their own. */
  const gone = smooth(0.42, 0.95, Math.abs(car.slipR));
  if(gone > 0.01) input.st = clamp(input.st*(1-gone) - Math.sign(car.omega)*gone*0.55, -1, 1);
  input.hb = 0; input.bo = false;
}

/* A stand-in for a person on a keyboard, for testing that WASD alone is enough
   to drive this road. Unlike the autopilot it cannot ask for 0.31 of steering:
   it can only hold a key or not, it re-decides about ten times a second rather
   than every frame, and everything it asks for goes through exactly the same
   input shaping the player's keystrokes do. */
const kb = { t:0, st:0, th:0, br:0 };
function keyboardAI(dt){
  kb.t -= dt;
  if(kb.t <= 0){
    kb.t = 0.09;
    const spd = Math.abs(car.vLong);
    const L = clamp(spd*0.9 + 12 + Math.abs(car.n)*0.9, 14, 68);
    let err = Math.atan2(-car.n, L) - car.yaw;
    err = Math.atan2(Math.sin(err), Math.cos(err));
    const yawRoad = car.omega - curvatureAt(car.s)*car.vLong;
    const want = (Math.atan2(2*WB*Math.sin(err), L)*(WB + KUS*spd*spd)/WB
                + steerForCurve(curvatureAt(car.s + spd*0.6), spd)
                - yawRoad*0.40*(WB + KUS*spd*spd)/Math.max(spd, 8)) / steerCapAt(spd);
    kb.st = Math.abs(want) < 0.12 ? 0 : Math.sign(want);
    let over = -99;
    const scan = clamp(spd*spd/16 + 40, 60, 400);
    for(let i=1;i<=10;i++){
      const ds = scan*i/10;
      const kk = Math.abs(curvatureAt(car.s + ds));
      const vC = clamp(Math.sqrt(5.5/Math.max(kk,1e-5)), 12, 44);
      over = Math.max(over, spd - Math.sqrt(vC*vC + 2*5.5*ds));
    }
    kb.th = over < -1.5 ? 1 : 0;
    kb.br = over >  1.0 ? 1 : 0;
  }
  KEYS_DOWN['KeyA'] = kb.st < 0; KEYS_DOWN['KeyD'] = kb.st > 0;
  KEYS_DOWN['KeyW'] = !!kb.th;   KEYS_DOWN['KeyS'] = !!kb.br;
}

let flashV=0;
function doRestart(){
  flashV=1;
  // The centreline is an incremental integration that only keeps a window
  // around the car, so jumping back to s=0 without rebuilding it leaves
  // frameAt() extrapolating garbage — the road folds into a vertical wall.
  pathReset();
  for(const [ci,ch] of roadChunks){ disposeGroup(ch.grp); roadChunks.delete(ci); }
  for(const [k,m] of tiles){
    if(m!=='pending'){ m.geometry.dispose(); m.removeFromParent(); }
    tiles.delete(k);
  }
  buildQueue.length = 0; scatterQueue.length = 0;
  scatterReset();
  resetCar();                       // also re-places the car and snaps the rig
  // every tile, or there are holes in the ground the moment the flash clears —
  // but let the vegetation stream in behind it rather than paying for both
  updateWorld(); drainQueue(600, 12);
  lodCheck(carRoot.position.x, carRoot.position.z);
  if(scatterDirty) scatterFlush();
  placeCar(); camSnap();
  for(let i=0;i<PN;i++) pLife[i]=0;
}

/*═══════════════════════════════════════════════════════════════════════════
  18 · HUD
═══════════════════════════════════════════════════════════════════════════*/
const elSpeed=document.getElementById('speed');
const elDist =document.getElementById('dist');
const elBoost=document.getElementById('boostFill');
const elTod  =document.getElementById('tod');
const elFlash=document.getElementById('flash');
let hudAcc=0, shownSpeed=0;
function updateHUD(dt){
  shownSpeed = damp(shownSpeed, Math.abs(car.vLong)*3.6, 12, dt);
  hudAcc+=dt;
  if(hudAcc>0.05){
    hudAcc=0;
    elSpeed.textContent = Math.round(shownSpeed);
    elDist.textContent  = (car.dist/1000).toFixed(2);
    elTod.textContent   = SKYST.name;
  }
  elBoost.style.transform = `scaleX(${car.boost})`;
  elBoost.style.opacity = car.boost<0.16 ? 0.35 : 1;
}

/*═══════════════════════════════════════════════════════════════════════════
  19 · WORLD STREAMING
═══════════════════════════════════════════════════════════════════════════*/
function updateWorld(){
  pathExtendTo(car.s + RD.ahead);
  pathTrimTo(car.s - RD.behind);
  if(car.s + RD.ahead > gridBuiltTo - 200 || car.s - RD.behind < gridBuiltFrom - 10) gridRebuild();

  { name:'medium', near:130, grass:2, rock:1, mesh:0.80, rad:[3,3,2], shadow:2048, rays:true , bloom:0.70 },

  // meshed. Probing upward on that evidence just costs a tier change.

  for(const fl of flames){
    fl.material.opacity = flameOn*0.62;
    fl.scale.set(1+Math.sin(clock*61)*0.2, 0.7+car.boostAmt*0.9, 1+Math.cos(clock*53)*0.2);
  }

  /* ---- sky / sun ---- */
  const lightDir = applySky(dt, camera.position);
  // Bias the cascade down the road instead of centring it on the car: the
  // camera sits ~9 m behind and looks 80 m forward, so a car-centred box spends
  // half its texels on ground nobody can see and stops shadowing exactly where
  // the eye is looking.
  {
    const wy = frameAt(car.s).h + car.yaw;
    const snap = 0.5, ahead = 26;
    const sx = _carPos.x + Math.sin(wy)*ahead, sz = _carPos.z + Math.cos(wy)*ahead;
    sunLight.target.position.set(sx, _carPos.y, sz);
    sunLight.position.set(
      Math.round((sx + lightDir.x*180)/snap)*snap,
      _carPos.y + lightDir.y*180,
      Math.round((sz + lightDir.z*180)/snap)*snap);
  }
  sunLight.target.updateMatrixWorld();
  // pmrem.fromScene allocates a fresh target every call, so this is the most
  // expensive recurring thing in the frame — the sky drifts slowly enough that
  // 1.6 s of granularity over a 180 s cycle is invisible
  // Track wall-clock, not the clamped simulation dt. Under software rendering
  // a frame can take seconds while dt is pinned at 0.06, so the bake never came
  // due and the fog kept sampling a sky from several minutes of cycle ago —
  // a night frame fogged with golden-hour gold.
  envTimer += rawDt;
  if(envTimer > 2.4){ envTimer=0; bakeEnv(); }

  /* ---- camera ---- */
  updateCamera(dt);
  applyCamLock();

  /* ---- particles: dust + sparks ---- */
  const spd=Math.abs(car.vLong);
  if(spd>4){
    const emitN = Math.round((car.screech*2.4 + car.offroad*2.6) * 60 * dt);
    const cy=Math.cos(car.yaw), sy=Math.sin(car.yaw);
    for(let i=0;i<emitN;i++){
      const side = i%2 ? 1 : -1;
      const lx=side*0.885, lz=-1.52;
      const dsW = lz*cy - lx*sy, dnW = lz*sy + lx*cy;
      roadToWorld(car.s+dsW, car.n+dnW, _right);
      const c = car.offroad>0.4 ? DUSTCOL : GRITCOL;
      emit(_right.x, _right.y+0.1, _right.z,
        (Math.random()-0.5)*3.2 - Math.sin(f.h+car.yaw)*spd*0.10,
        0.7+Math.random()*1.5,
        (Math.random()-0.5)*3.2 - Math.cos(f.h+car.yaw)*spd*0.10,
        0.34+Math.random()*0.5, 1.1+Math.random()*0.9, c);
    }
  }
  if(car.boostAmt>0.35 && Math.random()<dt*46){
    for(const ep of exhaustPos){
      const wp = carBody.localToWorld(_exW.copy(ep));
      emit(wp.x,wp.y,wp.z,
        (Math.random()-0.5)*2 - Math.sin(f.h+car.yaw)*6,
        Math.random()*1.4,
        (Math.random()-0.5)*2 - Math.cos(f.h+car.yaw)*6,
        0.13, 0.42, SPARKCOL);
    }
  }
  stepParticles(dt);

  /* ---- tyre marks ---- */
  if(car.screech>0.22 && spd>6 && !car.air){
    const cy=Math.cos(car.yaw), sy=Math.sin(car.yaw);
    for(let w=0;w<2;w++){
      const lx=(w?1:-1)*0.885, lz=-1.52;
      const dsW=lz*cy-lx*sy, dnW=lz*sy+lx*cy;
      roadToWorld(car.s+dsW, car.n+dnW, _carPos);
      const fw = frameAt(car.s+dsW);
      _right.set(Math.cos(fw.h+car.yaw),0,-Math.sin(fw.h+car.yaw));
      trailPush(w, _carPos, _right, clamp(car.screech,0,1)*0.9);
    }
  }
  trailFade(dt);

  /* ---- foliage sway uniforms ---- */
  if(leafMat.userData.sh){
    const lu = leafMat.userData.sh.uniforms;
    lu.uSunDir.value.copy(lightDir);
    lu.uSunCol.value.copy(SKYST.sun).multiplyScalar(SKYST.sunI * 0.055);
  }
  if(leafMat.userData.sh)  leafMat.userData.sh.uniforms.uTime.value = clock;
  if(grassMat.userData.sh) grassMat.userData.sh.uniforms.uTime.value = clock;
  starMat.uniforms.uTime.value = clock;
  starMat.uniforms.uPx.value = renderer.domElement.height/900;

  /* ---- post uniforms ---- */
  const spdN = clamp(spd/72,0,1);
  // Thresholds live in *linear HDR*: daytime sky sits around 1.3, so anything
  // under ~2 would bloom the entire sky into orange soup.
  // Night keeps a *higher* floor than intuition suggests: the scene is dark, so
  // a low threshold lets the car's own lamps bleed over half the frame.
  bloom.strength = SKYST.bloom * lerp(1.0, 0.62, SKYST.night) + car.boostAmt*0.18;
  bloom.radius   = 0.48 + car.boostAmt*0.14;
  // the low sun is orders of magnitude above the rest of the frame, so a 2.35
  // threshold let it bloom over the car itself — the subject was disappearing
  bloom.threshold= lerp(3.30, 1.15, SKYST.night);

  // sun screen position for god rays
  _sunScreen.copy(sunDir).multiplyScalar(9000).add(camera.position);
  _sunScreen.project(camera);
  const sunOnScreen = _sunScreen.z < 1;
  const sx=(_sunScreen.x*0.5+0.5), sy2=(_sunScreen.y*0.5+0.5);
  const offEdge = Math.max(Math.abs(sx-0.5), Math.abs(sy2-0.5));
  const vis = sunOnScreen ? clamp(1 - smooth(0.5, 1.15, offEdge), 0, 1) : 0;
  godRays.prep.uniforms.uSun.value.set(sx,sy2);
  godRays.blur.uniforms.uSun.value.set(sx,sy2);
  godRays.comp.uniforms.uStrength.value = SKYST.rayS * vis * 0.95;
  godRays.comp.uniforms.uTint.value.copy(SKYST.sun).lerp(WHITE, 0.25);

  const cu=compositePass.uniforms;
  cu.uTime.value = clock;
  cu.uRes.value.set(innerWidth,innerHeight);
  cu.uBlur.value = (Math.pow(spdN,2.3)*0.019 + car.boostAmt*0.030);
  cu.uCA.value   = 0.0013 + spdN*0.0022 + car.boostAmt*0.0026;
  cu.uLines.value= car.boostAmt*clamp(spdN*1.5,0,1);
  cu.uGrain.value= 0.022 + SKYST.night*0.020;
  cu.uVign.value = 0.55 + spdN*0.13 + car.boostAmt*0.10;
  cu.uSat.value  = 1.11 + SKYST.night*0.04;
  const gt = SKYST.grade, tint = 0.30;
  cu.uGain.value.set(lerp(1,gt.r,tint), lerp(1,gt.g,tint), lerp(1,gt.b,tint));
  const cool = 0.26*(1-SKYST.night*0.55);
  cu.uShad.value.set(lerp(1,0.78,cool), lerp(1,0.88,cool), lerp(1,1.10,cool));
  flashV = Math.max(0, flashV - dt*1.8);
  cu.uFlash.value = flashV*0.85;

  /* ---- audio, hud ---- */
  updateAudio(dt);
  updateHUD(dt);
  if(car.landImpact>0.25){ thumpSound(car.landImpact); car.landImpact=0; }

  if(SAFE.nopost){ renderer.setRenderTarget(null); renderer.render(scene, camera); }
  else composer.render();
  /* CPU cost of building and submitting the frame. With a cap in place fps
     alone can no longer tell headroom from a machine that is exactly at the
     limit — both read 60 — so the climb needs a second opinion. */
  frameMs += (performance.now() - t0 - frameMs)*0.1;
  if(DBG.el) dbgTick(dt);
  lastInfo = { calls: renderer.info.render.calls,
               triangles: renderer.info.render.triangles,
               geometries: renderer.info.memory.geometries,
               textures: renderer.info.memory.textures,
               programs: renderer.info.programs ? renderer.info.programs.length : -1 };
}

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  dprBase = Math.min(devicePixelRatio||1, DPR_CAP);
  if((location.hash||'').toLowerCase().includes('dpr1')) dprBase = 1;
  applyRenderScale();
});

applyRenderScale();          // size every buffer off the integer canvas once
requestAnimationFrame(frame);

/** Push the physics state onto the scene graph. Shared by the render loop and
    the headless simulators so camera maths always sees a current car transform. */
function placeCar(){
  const f = frameAt(car.s);
  roadToWorld(car.s, car.n, _carPos);
  carRoot.position.set(_carPos.x, car.y, _carPos.z);
  carRoot.rotation.set(0, f.h + car.yaw, 0);
  // bank with the road under the body, plus dynamic pitch/roll
  carBody.rotation.set(car.pitch, 0, car.roll + Math.atan(f.b)*Math.cos(car.yaw));
  carBody.position.y = 0;
  return f;
}

/** Advance the simulation at a fixed step without rendering.
    Lets the capture harness reach cruising speed instantly under software GL. */
function warp(sec, throttle){
  const dt = 1/60, n = Math.min(Math.round(sec/dt), 6000);
  const th = throttle===undefined ? 1 : throttle;
  for(let i=0;i<n;i++){
    autopilot();
    if(th!==1) input.th = Math.min(input.th, th);
    stepPhysics(dt);
    clock += dt;
    if(i%8===0){ updateWorld(); drainQueue(8); }
    placeCar(); updateCamera(dt);
  }
  updateWorld(); drainQueue(600);
  lodCheck(carRoot.position.x, carRoot.position.z);
  if(scatterDirty) scatterFlush();
  applySky(0, camera.position); bakeEnv();
}

/** Drive a scripted key sequence at a fixed step, sampling the sim each frame.
    `plan` is [{sec, keys:['KeyW','Space',…]}]; returns per-frame telemetry. */
function simulate(plan, sampleHz, hz){
  const rate = hz || 60;
  const dt = 1/rate, every = Math.max(1, Math.round(rate/(sampleHz||20)));
  const prevAuto = autoDrive; autoDrive = false;
  const out = []; let i = 0;
  for(const seg of plan){
    for(const k in KEYS_DOWN) delete KEYS_DOWN[k];
    for(const k of (seg.keys||[])) KEYS_DOWN[k] = true;
    const n = Math.round(seg.sec/dt);
    for(let j=0;j<n;j++,i++){
      if(seg.kb) keyboardAI(dt);
      readInput(dt);
      if(seg.autoSteer){
        // lane-keeping underneath, scripted pedals and counter-steer on top
        const th=input.th, br=input.br, hb=input.hb, bo=input.bo, man=input.st;
        autopilot();
        if(!seg.autoPedal){ input.th=th; input.br=br; }
        input.hb=hb; input.bo=bo;
        input.st = clamp(input.st + man, -1, 1);
      }
      stepPhysics(dt); clock += dt;
      if(i%8===0){ updateWorld(); drainQueue(6); }
      placeCar(); updateCamera(dt);
      if(i%every===0) out.push({
        t:+(i*dt).toFixed(3), tag:seg.tag||'',
        kmh:+(Math.hypot(car.vLong,car.vLat)*3.6).toFixed(1),
        slip:+(car.slipR*57.3).toFixed(2), yawRate:+car.omega.toFixed(3),
        roll:+car.roll.toFixed(3), pitch:+car.pitch.toFixed(3),
        air:car.air?1:0, y:+car.y.toFixed(2),
        ext:+(car.ext||0).toFixed(3), vy:+car.vy.toFixed(2),
        off:+car.n.toFixed(2), boost:+car.boost.toFixed(2),
        s:Math.round(car.s), k:+(curvatureAt(car.s)*1000).toFixed(2),
        st:+car.steer.toFixed(3), fov:+camera.fov.toFixed(2),
        camD:+Math.hypot(camera.position.x-carRoot.position.x,
                         camera.position.z-carRoot.position.z).toFixed(2),
        camY:+(camera.position.y-carRoot.position.y).toFixed(2),
      });
    }
  }
  for(const k in KEYS_DOWN) delete KEYS_DOWN[k];
  autoDrive = prevAuto;
  updateWorld(); drainQueue(600);
  lodCheck(carRoot.position.x, carRoot.position.z);
  if(scatterDirty) scatterFlush();
  return out;
}

// expose for the headless harness
const RD1PX = new Uint8Array(4);
window.__game = { car, SKYST, get fps(){return fpsAvg;}, renderer, scene, camera, warp, simulate,
  setDay:v=>{dayT=v;}, get dayT(){return dayT;}, begin:beginGame, input, KEYS_DOWN,
  bloom, godRays, compositePass, sky, THREE, frameAt, terrainHeight, roadMat, paintMat,
  info:()=>lastInfo, probe, setAuto:v=>{autoDrive=v;}, camSnap, placeCar, settleSuspension,
  stepPhysics, PHYS_HZ, get fpsCap(){return fpsCap;},
  setCap:hz=>{ fpsCap = hz; paceCount = 0; },
  get rendered(){return renderedFrames;},
  /** Run the pacer over a synthetic vsync grid. Returns the rate admitted and
      the spread of the gaps between admitted frames, which is the thing that
      actually shows up as judder. */
  pacerTrial:(hz, refresh, seconds)=>{
    const keep = [fpsCap, lastRAF, paceCount, vsPeriod, vsMin, vsCount, vsWindow];
    fpsCap = hz; lastRAF = 0; paceCount = 0;
    vsPeriod = 0; vsMin = 1e9; vsCount = 0; vsWindow = 20;
    const step = 1000/refresh, total = Math.round(refresh*seconds);
    const hits = [];
    for(let i=1;i<=total;i++) if(framePaceOK(i*step)) hits.push(i*step);
    // ignore the lock-on window while the refresh rate is still being measured
    const gaps = [];
    for(let i=Math.max(1,(hits.length*0.25)|0);i<hits.length;i++) gaps.push(hits[i]-hits[i-1]);
    [fpsCap, lastRAF, paceCount, vsPeriod, vsMin, vsCount, vsWindow] = keep;
    return { fps: hits.length/seconds,
             gapMin: gaps.length?Math.min(...gaps):0,
             gapMax: gaps.length?Math.max(...gaps):0 };
  },
  restart:doRestart, clearFlash:()=>{flashV=0;}, bakeEnv,
  setPaused:v=>{ paused = !!v; last = performance.now(); lastRAF = 0; physAcc = 0; },
  /** One synchronous frame, so a harness can time the pipe without racing rAF.
      `sceneOnly` skips post, which is how the split between raster and effects
      gets measured. */
  renderOnce:(sceneOnly)=>{
    // The beauty rig is normally applied by the render loop, but a frame takes
    // tens of seconds in software, so a harness that locks the camera and then
    // renders explicitly would otherwise capture whatever pose the loop last
    // managed to finish.
    applyCamLock();
    if(sceneOnly){ renderer.setRenderTarget(null); renderer.render(scene, camera); }
    else composer.render();
    // SwiftShader queues lazily; without a readback the timing measures the
    // submit, not the draw.
    const gl = renderer.getContext();
    gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, RD1PX);
  },
  lockCam:v=>{camLock=v;}, carBody, carRoot, wheelHub,
  CAMS, setCam:i=>{camMode=i; cam.init=false;}, get camMode(){return camMode;},
  canopyAt, IM, setPerf, QTIERS, get tier(){return QTIERS[qIdx].name;},
  get streamPeak(){return streamPeak;}, resetPeak:()=>{streamPeak=0;},
  /* One frame of the world-streaming block, timed. renderer.info folds the
     shadow pass and the cube bake into its triangle total, and rAF under
     SwiftShader is far too slow to sample, so cost gets measured directly. */
  streamTick:()=>{
    const t0=performance.now();
    updateWorld();
    const t1=performance.now();
    drainQueue(1,1);
    const t2=performance.now();
    lodCheck(carRoot.position.x, carRoot.position.z);
    const flushed = scatterDirty;
    if(scatterDirty) scatterFlush();
    const t3=performance.now();
    return { total:t3-t0, world:t1-t0, build:t2-t1, flush:t3-t2,
             flushed, q:buildQueue.length, sq:scatterQueue.length };
  },
  /* Triangles actually submitted by the main camera pass, counted from the
     scene graph rather than from renderer.info. */
  counts:()=>{
    const o={ tris:0, calls:0, by:{} };
    scene.traverseVisible(ob=>{
      const g=ob.geometry; if(!g || !ob.isMesh && !ob.isPoints && !ob.isLine) return;
      const n = ob.isInstancedMesh ? ob.count : 1;
      if(n===0) return;
      const t = ((g.index ? g.index.count : g.attributes.position.count)/3|0) * n;
      o.tris += t; o.calls++;
      const k = ob.name || (ob.isInstancedMesh?'inst':'mesh');
      o.by[k] = (o.by[k]||0) + t;
    });
    for(const k in IM) o[k]=IM[k].count;
    o.carParts = 0; carRoot.traverseVisible(ob=>{ if(ob.isMesh) o.carParts++; });
    o.tiles = tiles.size; o.roadChunks = roadChunks.size;
    return o;
  } };
</script>
