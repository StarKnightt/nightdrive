<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GOLDEN HOUR — an endless drive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: rgba(255,255,255,.94);
    --dim: rgba(255,255,255,.42);
    --fnt: 'Barlow Condensed', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#07090d;}
  body{font-family:var(--fnt);-webkit-font-smoothing:antialiased;cursor:default}
  canvas{display:block;width:100%;height:100%;position:fixed;inset:0}

  #hud{
    position:fixed;inset:0;pointer-events:none;z-index:10;
    opacity:0;transition:opacity 1.1s ease .25s;
    text-shadow:0 1px 14px rgba(0,0,0,.55);
  }
  #hud.on{opacity:1}

  /* ---------- speed, bottom center ---------- */
  #speedWrap{
    position:absolute;left:50%;bottom:clamp(20px,4.4vh,46px);transform:translateX(-50%);
    display:flex;align-items:baseline;gap:.42em;
    color:var(--ink);
  }
  #speed{
    font-size:clamp(52px,7.4vw,104px);font-weight:300;line-height:.82;
    letter-spacing:-.028em;font-variant-numeric:tabular-nums;
    min-width:2.6em;text-align:right;
  }
  #speedUnit{
    font-size:clamp(11px,1.15vw,15px);font-weight:500;letter-spacing:.34em;
    color:var(--dim);text-transform:uppercase;padding-bottom:.55em;
  }

  /* ---------- boost bar, under speed ---------- */
  #boostTrack{
    position:absolute;left:50%;bottom:clamp(11px,2.1vh,25px);transform:translateX(-50%);
    width:clamp(148px,17vw,236px);height:2px;border-radius:2px;
    background:rgba(255,255,255,.13);overflow:hidden;
  }
  #boostFill{
    height:100%;width:100%;transform-origin:left center;
    background:linear-gradient(90deg,#ff8a3d,#ffd479);
    box-shadow:0 0 10px rgba(255,150,60,.75);
    transition:opacity .25s ease;
  }

  /* ---------- distance, bottom left ---------- */
  #distWrap{
    position:absolute;left:clamp(20px,3.2vw,50px);bottom:clamp(22px,4.6vh,48px);
    color:var(--ink);
  }
  #dist{font-size:clamp(20px,2.2vw,30px);font-weight:400;letter-spacing:.008em;font-variant-numeric:tabular-nums;line-height:1}
  #distLabel{font-size:10px;font-weight:500;letter-spacing:.3em;color:var(--dim);text-transform:uppercase;margin-top:6px}

  /* ---------- time of day, bottom right ---------- */
  #todWrap{
    position:absolute;right:clamp(20px,3.2vw,50px);bottom:clamp(22px,4.6vh,48px);
    text-align:right;color:var(--ink);
  }
  #tod{font-size:clamp(15px,1.55vw,21px);font-weight:400;letter-spacing:.15em;text-transform:uppercase;line-height:1}
  #todLabel{font-size:10px;font-weight:500;letter-spacing:.3em;color:var(--dim);text-transform:uppercase;margin-top:7px}

  /* fades in on C, then gets out of the way — the scenery is the UI */
  #camTag{
    position:absolute;left:50%;transform:translateX(-50%);
    top:clamp(20px,4vh,44px);color:var(--ink);opacity:0;
    font-size:11px;font-weight:500;letter-spacing:.42em;text-transform:uppercase;
    text-shadow:0 1px 14px rgba(0,0,0,.55);transition:opacity .5s ease;
  }
  #camTag.show{opacity:.85;transition:opacity .12s ease}

  /* ---------- title / start card ---------- */
  #start{
    position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:0;
    background:radial-gradient(120% 90% at 50% 46%, #1a1f2b 0%, #0a0c12 55%, #06070a 100%);
    color:#fff;transition:opacity 1.25s cubic-bezier(.4,0,.2,1);
  }
  #start.hide{opacity:0;pointer-events:none}
  #title{
    font-size:clamp(46px,10.5vw,148px);font-weight:200;letter-spacing:.13em;line-height:.96;
    text-transform:uppercase;
    background:linear-gradient(178deg,#fff 8%,#ffcf9a 52%,#ff8a45 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  #sub{
    margin-top:20px;font-size:clamp(10px,1.15vw,13px);font-weight:400;letter-spacing:.52em;
    text-transform:uppercase;color:rgba(255,255,255,.35);text-indent:.52em;
  }
  #keys{
    margin-top:clamp(38px,6.4vh,68px);display:flex;gap:clamp(16px,2.6vw,34px);flex-wrap:wrap;
    justify-content:center;max-width:min(90vw,700px);
  }
  .k{display:flex;align-items:center;gap:9px;color:rgba(255,255,255,.5);font-size:12px;letter-spacing:.13em;text-transform:uppercase}
  .k b{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:26px;height:24px;padding:0 8px;border-radius:5px;
    border:1px solid rgba(255,255,255,.17);background:rgba(255,255,255,.05);
    color:rgba(255,255,255,.86);font-weight:500;font-size:11px;letter-spacing:.08em;
  }
  #go{
    margin-top:clamp(34px,5.6vh,58px);font-size:11px;letter-spacing:.42em;text-transform:uppercase;
    color:rgba(255,255,255,.75);text-indent:.42em;
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.32}50%{opacity:1}}

  #loadBar{
    position:absolute;left:50%;bottom:52px;transform:translateX(-50%);
    width:180px;height:1px;background:rgba(255,255,255,.1);overflow:hidden
  }
  #loadFill{height:100%;width:0%;background:rgba(255,255,255,.55);transition:width .45s ease}

  /* ---------- flash for restart ---------- */
  #flash{position:fixed;inset:0;z-index:20;background:#fff;opacity:0;pointer-events:none}

  @media (max-width:620px){
    #keys{display:none}
    #todWrap{display:none}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="distWrap"><div id="dist">0.00</div><div id="distLabel">km</div></div>
  <div id="speedWrap"><div id="speed">0</div><div id="speedUnit">km/h</div></div>
  <div id="boostTrack"><div id="boostFill"></div></div>
  <div id="todWrap"><div id="tod">Golden Hour</div><div id="todLabel">light</div></div>
  <div id="camTag">CHASE</div>
</div>

<div id="flash"></div>

<div id="start">
  <div id="title">Golden&nbsp;Hour</div>
  <div id="sub">an endless drive</div>
  <div id="keys">
    <div class="k"><b>W</b><b>S</b> throttle</div>
    <div class="k"><b>A</b><b>D</b> steer</div>
    <div class="k"><b>Shift</b> boost</div>
    <div class="k"><b>Space</b> drift</div>
    <div class="k"><b>C</b> camera</div>
    <div class="k"><b>V</b> fps cap</div>
    <div class="k"><b>R</b> restart</div>
  </div>
  <div id="go">Press any key to drive</div>
  <div id="loadBar"><div id="loadFill"></div></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }     from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass }     from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass }from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }     from 'three/addons/postprocessing/OutputPass.js';
import { Pass, FullScreenQuad } from 'three/addons/postprocessing/Pass.js';
import { Sky }            from 'three/addons/objects/Sky.js';

/*═══════════════════════════════════════════════════════════════════════════
  0 · MATH / NOISE
═══════════════════════════════════════════════════════════════════════════*/
const TAU = Math.PI * 2;
const clamp  = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp   = (a,b,t)=> a+(b-a)*t;
const smooth = (e0,e1,x)=>{ const t=clamp((x-e0)/(e1-e0),0,1); return t*t*(3-2*t); };
const damp   = (a,b,l,dt)=> lerp(a,b,1-Math.exp(-l*dt));

function hashI(x,y){
  let h = Math.imul(x|0, 374761393) ^ Math.imul(y|0, 668265263);
  h = Math.imul(h ^ (h>>>13), 1274126177);
  return ((h ^ (h>>>16))>>>0) / 4294967296;
}
function hash1(i){
  let h = Math.imul(i|0, 2654435761);
  h = Math.imul(h ^ (h>>>15), 2246822519);
  return ((h ^ (h>>>13))>>>0) / 4294967296;
}
// value noise, quintic
function vnoise(x,y){
  const xi=Math.floor(x), yi=Math.floor(y);
  const xf=x-xi, yf=y-yi;
  const u=xf*xf*xf*(xf*(xf*6-15)+10);
  const v=yf*yf*yf*(yf*(yf*6-15)+10);
  const a=hashI(xi,yi), b=hashI(xi+1,yi), c=hashI(xi,yi+1), d=hashI(xi+1,yi+1);
  return lerp(lerp(a,b,u), lerp(c,d,u), v)*2-1;
}
function fbm(x,y,oct=5,lac=2.03,gain=0.5){
  let s=0,a=0.5,f=1,n=0;
  for(let i=0;i<oct;i++){ s+=a*vnoise(x*f,y*f); n+=a; a*=gain; f*=lac; }
  return s/n;
}
function ridged(x,y,oct=5){
  let s=0,a=0.5,f=1,n=0;
  for(let i=0;i<oct;i++){
    let v=1-Math.abs(vnoise(x*f,y*f));
    v*=v; s+=a*v; n+=a; a*=0.52; f*=2.07;
  }
  return s/n;
}

/*═══════════════════════════════════════════════════════════════════════════
  1 · RENDERER / SCENE
═══════════════════════════════════════════════════════════════════════════*/
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({
  canvas, antialias:false, stencil:false, powerPreference:'high-performance'
});
const DPR_CAP = 1.7;
renderer.setPixelRatio(Math.min(devicePixelRatio||1, DPR_CAP));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = true;
const MAXANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xe8a86c, 0.0018);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.4, 16000);
camera.position.set(0, 6, -12);

/*───────────────────────────────────────────────────────────────────────────
  Aerial perspective. A single authored fog colour can never match a sky
  that changes hue across the dome, so distant ridges end up glowing pink
  against a teal dusk. Instead every fogged pixel samples the live sky in
  its own view direction — mountains dissolve into exactly the sky behind
  them, and the sun side of the haze glows while the shadow side goes cold.
───────────────────────────────────────────────────────────────────────────*/
/* 128 rather than 64: this cube is now the PMREM source as well as the fog
   lookup, and the car's clearcoat shows the difference. */
const skyRT = new THREE.WebGLCubeRenderTarget(128, { type: THREE.HalfFloatType });
skyRT.texture.minFilter = THREE.LinearMipmapLinearFilter;
skyRT.texture.generateMipmaps = true;
const skyCam = new THREE.CubeCamera(1, 40000, skyRT);

/* cloneUniforms() refuses to copy render-target textures, so the sky cube
   cannot ride along in UniformsLib — hand it to each shader at compile time */
const SKYFOG_U = { value: skyRT.texture };
THREE.Material.prototype.onBeforeCompile = function(shader){
  shader.uniforms.fogSky = SKYFOG_U;
};
/** wrap a material-specific patch so it keeps the sky-fog uniform */
function fogPatch(fn){
  return function(shader, r){ shader.uniforms.fogSky = SKYFOG_U; fn.call(this, shader, r); };
}
THREE.ShaderChunk.fog_pars_vertex = /* glsl */`
#ifdef USE_FOG
  varying float vFogDepth;
  varying vec3  vFogView;
#endif`;
THREE.ShaderChunk.fog_vertex = /* glsl */`
#ifdef USE_FOG
  vFogDepth = - mvPosition.z;
  vFogView  = mvPosition.xyz;
#endif`;
THREE.ShaderChunk.fog_pars_fragment = /* glsl */`
#ifdef USE_FOG
  uniform vec3  fogColor;
  uniform samplerCube fogSky;
  varying float vFogDepth;
  varying vec3  vFogView;
  #ifdef FOG_EXP2
    uniform float fogDensity;
  #else
    uniform float fogNear;
    uniform float fogFar;
  #endif
#endif`;
THREE.ShaderChunk.fog_fragment = /* glsl */`
#ifdef USE_FOG
  #ifdef FOG_EXP2
    float fogFactor = 1.0 - exp( - fogDensity * fogDensity * vFogDepth * vFogDepth );
  #else
    float fogFactor = smoothstep( fogNear, fogFar, vFogDepth );
  #endif
  // view->world rotation is the transpose of the view matrix's basis
  vec3 fdir = normalize( vFogView * mat3( viewMatrix ) );
  fdir.y = max( fdir.y, -0.03 );        // ground haze takes the horizon colour
  vec3 fcol = mix( fogColor, textureCube( fogSky, normalize(fdir) ).rgb, 0.86 );
  gl_FragColor.rgb = mix( gl_FragColor.rgb, fcol, fogFactor );
#endif`;

/*═══════════════════════════════════════════════════════════════════════════
  2 · TEXTURES — procedural now, photographic PBR streamed in behind it
═══════════════════════════════════════════════════════════════════════════*/
const PH = 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k';
const texLoader = new THREE.TextureLoader();
texLoader.setCrossOrigin('anonymous');

let pendingTex = 0, doneTex = 0;
const loadFill = document.getElementById('loadFill');
function texProgress(){
  if(!pendingTex) return;
  loadFill.style.width = Math.round(100*doneTex/pendingTex)+'%';
}

/** Load one Poly Haven map; on success hand it to `apply`. Never blocks. */
function streamMap(slug, kind, colorSpace, apply){
  pendingTex++;
  texLoader.load(`${PH}/${slug}/${slug}_${kind}_1k.jpg`,
    t=>{
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.anisotropy = MAXANISO;
      if(colorSpace) t.colorSpace = colorSpace;
      apply(t); doneTex++; texProgress();
    },
    undefined,
    ()=>{ doneTex++; texProgress(); }
  );
}

function canvasTex(w,h,draw,{srgb=true,repeat=true,aniso=true}={}){
  const cv = document.createElement('canvas');
  cv.width=w; cv.height=h;
  draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv);
  if(repeat) t.wrapS=t.wrapT=THREE.RepeatWrapping;
  if(aniso) t.anisotropy=MAXANISO;
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  return t;
}

/* -- fallback asphalt ---------------------------------------------------- */
const asphaltFallback = canvasTex(512,512,(g,w,h)=>{
  g.fillStyle='#2b2b2e'; g.fillRect(0,0,w,h);
  const img=g.getImageData(0,0,w,h), d=img.data;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=(y*w+x)*4;
    const n = (hashI(x*3+1,y*3+7)+hashI(x*7,y*5)*0.6)/1.6;
    const v = 30 + n*36;
    d[i]=v; d[i+1]=v+1; d[i+2]=v+3;
  }
  g.putImageData(img,0,0);
});

/* -- road markings: one 16 m tile, u across full road width -------------- */
const ROAD_HALF   = 4.6;    // asphalt half width  (9.2 m)
const MARK_TILE   = 16;     // metres per texture repeat along the road
const markingsTex = canvasTex(1024, 2048, (g,w,h)=>{
  g.clearRect(0,0,w,h);
  const pxPerM_x = w/(ROAD_HALF*2);
  const pxPerM_y = h/MARK_TILE;
  const cx = w/2;

  // --- worn tyre paths (darkening, drawn as alpha-black) ---
  for(const off of [-1.75, 1.75]){
    const x = cx + off*pxPerM_x, wdt = 0.95*pxPerM_x;
    const grd = g.createLinearGradient(x-wdt,0,x+wdt,0);
    grd.addColorStop(0,'rgba(10,10,12,0)');
    grd.addColorStop(.5,'rgba(10,10,12,.30)');
    grd.addColorStop(1,'rgba(10,10,12,0)');
    g.fillStyle=grd; g.fillRect(x-wdt,0,wdt*2,h);
  }

  // --- paint helper: slightly grubby white ---
  function paint(x0,y0,x1,y1){
    g.fillStyle='rgba(232,231,222,0.95)';
    g.fillRect(x0,y0,x1-x0,y1-y0);
    // scuff the edges so it doesn't read as vector art
    const n = Math.max(2, Math.round((y1-y0)/9));
    for(let i=0;i<n;i++){
      const yy = y0 + (y1-y0)*i/n;
      const hh = (y1-y0)/n;
      g.fillStyle = `rgba(20,20,22,${0.06+hashI(i*13,x0|0)*0.16})`;
      if(hashI(i*7,(x0|0)+3) > 0.62) g.fillRect(x0, yy, x1-x0, hh*0.6);
    }
  }

  // --- solid edge lines (just inside the asphalt edge) ---
  const edgeW = 0.15*pxPerM_x;
  for(const off of [-3.95, 3.95]){
    const x = cx + off*pxPerM_x;
    paint(x-edgeW/2, 0, x+edgeW/2, h);
  }

  // --- dashed centre line: 4 m dash / 4 m gap → exactly 2 per 16 m tile ---
  const cW = 0.16*pxPerM_x;
  for(let k=0;k<2;k++){
    const y0 = (k*8)*pxPerM_y, y1 = (k*8+4)*pxPerM_y;
    paint(cx-cW/2, y0, cx+cW/2, y1);
  }

  // --- hairline cracks ---
  g.strokeStyle='rgba(12,12,14,.42)'; g.lineWidth=1.6;
  for(let i=0;i<26;i++){
    let x=hashI(i,91)*w, y=hashI(i,17)*h;
    g.beginPath(); g.moveTo(x,y);
    for(let s=0;s<7;s++){
      x += (hashI(i*31+s,5)-0.5)*46;
      y += (hashI(i*31+s,9)-0.5)*74;
      g.lineTo(x,y);
    }
    g.stroke();
  }
}, {srgb:true});
markingsTex.wrapS = THREE.ClampToEdgeWrapping;   // never wrap across the road
markingsTex.wrapT = THREE.RepeatWrapping;

/* -- fallback grass / rock ------------------------------------------------*/
function groundFallback(base, spread, seedo){
  return canvasTex(256,256,(g,w,h)=>{
    const img=g.createImageData(w,h), d=img.data;
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      const i=(y*w+x)*4;
      const n = fbm(x*0.09+seedo, y*0.09+seedo, 4)*0.5+0.5;
      const m = hashI(x+seedo,y*3+seedo);
      d[i]  = clamp(base[0]+ (n-0.5)*spread + (m-0.5)*16, 0,255);
      d[i+1]= clamp(base[1]+ (n-0.5)*spread + (m-0.5)*16, 0,255);
      d[i+2]= clamp(base[2]+ (n-0.5)*spread*0.6 + (m-0.5)*12, 0,255);
      d[i+3]= 255;
    }
    g.putImageData(img,0,0);
  });
}
const grassFallback = groundFallback([74,88,48], 46, 3.1);
const rockFallback  = groundFallback([104,99,92], 40, 11.7);
const barkFallback  = groundFallback([70,56,44], 34, 21.3);

/* -- soft round sprite (dust, stars, glows) -------------------------------*/
const softSprite = canvasTex(128,128,(g,w,h)=>{
  const grd=g.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);
  grd.addColorStop(0,'rgba(255,255,255,1)');
  grd.addColorStop(.32,'rgba(255,255,255,.62)');
  grd.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=grd; g.fillRect(0,0,w,h);
},{repeat:false});

/*═══════════════════════════════════════════════════════════════════════════
  3 · ROAD GEOMETRY MODEL  (pure functions of arc-length s)
═══════════════════════════════════════════════════════════════════════════*/
const RD = {
  step   : 3,          // m between centreline samples
  half   : ROAD_HALF,  // asphalt half width
  verge  : 6.5,        // gravel shoulder outer edge
  apron  : 20,         // embankment outer edge (< min turn radius → never folds)
  behind : 420,
  ahead  : 1500,
};

/** curvature (1/m) — layered so the road is essentially never straight */
function curvatureAt(s){
  // Radii are sized so the car can *flow*: peak sum ≈ 0.0056 1/m (≈180 m
  // radius) is about 0.9 g at 160 km/h. Tighter than this and a 300 km/h car
  // spends the whole drive braking instead of arcing through sweepers.
  let k = 0.00268*Math.sin(s*0.001710 + 0.00)
        + 0.00162*Math.sin(s*0.004170 + 2.10)
        + 0.00091*Math.sin(s*0.009540 + 4.30)
        + 0.00042*Math.sin(s*0.023100 + 1.20);
  // occasional hairpin
  const per = 1750, idx = Math.floor(s/per);
  for(const j of [idx-1, idx]){
    if(j<0) continue;
    const c  = j*per + 320 + hash1(j*7+3)*(per-760);
    const hl = 52 + hash1(j*13+5)*26;
    const d  = (s-c)/hl;
    if(Math.abs(d) < 1){
      const wgt = Math.cos(d*Math.PI*0.5);
      k += (hash1(j*29+11) > 0.5 ? 1 : -1) * wgt*wgt * 0.0155;
    }
  }
  return k;
}
/** elevation (m) */
function elevAt(s){
  return 24.0*Math.sin(s*0.001130 + 0.70)
       + 12.5*Math.sin(s*0.002690 + 2.90)
       +  5.2*Math.sin(s*0.006310 + 1.10)
       +  1.9*Math.sin(s*0.015400 + 3.70);
}
/** superelevation as a slope (rise per metre of lateral offset) */
function bankAt(k){ return -clamp(k*8.2, -0.155, 0.155); }

/* ---- incremental centreline -------------------------------------------- */
const path = {
  s:[], x:[], z:[], y:[], h:[], k:[], b:[],
  s0:0, i0:0,          // s and index of element 0
  coarse:[],           // every 60 m, kept forever: {s,x,z}
};
function pathReset(){
  path.s.length=path.x.length=path.z.length=path.y.length=0;
  path.h.length=path.k.length=path.b.length=0;
  path.coarse.length=0;
  let s=-RD.behind-60, hh=0;
  // integrate heading from 0 backwards is messy — start the world at s=-480
  // and integrate forward, the car begins at s=0.
  let x=0,z=0;
  s = -RD.behind-60; hh = 0; x=0; z=0;
  // integrate from s to 0 to place the origin correctly
  const n0 = Math.round((0-s)/RD.step);
  for(let i=0;i<=n0;i++){
    const ss = s + i*RD.step;
    pushSample(ss, x, z, hh);
    const k = curvatureAt(ss);
    hh += k*RD.step;
    x  += Math.sin(hh)*RD.step;
    z  += Math.cos(hh)*RD.step;
  }
  path.headS = path.s[path.s.length-1];
  path.headX = x; path.headZ = z; path.headH = hh;
}
function pushSample(ss,x,z,hh){
  const k = curvatureAt(ss);
  path.s.push(ss); path.x.push(x); path.z.push(z);
  path.y.push(elevAt(ss)); path.h.push(hh); path.k.push(k);
  path.b.push(bankAt(k));
  if(path.coarse.length===0 || ss - path.coarse[path.coarse.length-1].s >= 60){
    path.coarse.push({s:ss,x:x,z:z});
  }
}
function pathExtendTo(sTarget){
  while(path.headS < sTarget){
    const k  = curvatureAt(path.headS);
    path.headH += k*RD.step;
    path.headX += Math.sin(path.headH)*RD.step;
    path.headZ += Math.cos(path.headH)*RD.step;
    path.headS += RD.step;
    pushSample(path.headS, path.headX, path.headZ, path.headH);
  }
}
function pathTrimTo(sMin){
  let n=0;
  while(path.s.length-n > 8 && path.s[n] < sMin) n++;
  if(n>0){
    path.s.splice(0,n); path.x.splice(0,n); path.z.splice(0,n);
    path.y.splice(0,n); path.h.splice(0,n); path.k.splice(0,n); path.b.splice(0,n);
    path.i0 += n;
  }
}
/** interpolated frame at arc-length s */
const _fr = {x:0,y:0,z:0,h:0,k:0,b:0};
function frameAt(s){
  const n = path.s.length;
  let i = Math.floor((s - path.s[0]) / RD.step);
  i = clamp(i, 0, n-2);
  const t = clamp((s - path.s[i]) / RD.step, 0, 1);
  // heading can wind; interpolate the raw (already-continuous) value
  _fr.x = lerp(path.x[i], path.x[i+1], t);
  _fr.z = lerp(path.z[i], path.z[i+1], t);
  _fr.y = elevAt(s);
  _fr.h = lerp(path.h[i], path.h[i+1], t);
  _fr.k = curvatureAt(s);
  _fr.b = bankAt(_fr.k);
  return _fr;
}
/** world position of road coordinate (s, n) — n is offset along `side` */
function roadToWorld(s, n, out){
  const f = frameAt(s);
  const cs = Math.cos(f.h), sn = Math.sin(f.h);
  out.x = f.x + cs*n;
  out.z = f.z - sn*n;
  out.y = roadSurfaceY(f, n);
  return out;
}
/** surface height at road coordinate, incl. crown, banking and shoulder drop */
function roadSurfaceY(f, n){
  const an = Math.abs(n);
  let y = f.y + n*f.b;
  y -= Math.pow(Math.min(an,RD.half)/RD.half, 2) * 0.075;       // crown
  if(an > RD.half) y -= Math.min(an-RD.half, 1.9)*0.16;         // shoulder drop
  return y;
}

/*═══════════════════════════════════════════════════════════════════════════
  4 · ROAD PROXIMITY FIELD  (for terrain carving + scatter rejection)
═══════════════════════════════════════════════════════════════════════════*/
const CELL = 24;
const roadGrid = new Map();
const gkey = (cx,cz)=> cx*73856093 ^ cz*19349663;
let gridBuiltTo = -1e9, gridBuiltFrom = 1e9;

function gridInsert(i){
  const cx = Math.floor(path.x[i]/CELL), cz = Math.floor(path.z[i]/CELL);
  const k = gkey(cx,cz);
  let a = roadGrid.get(k);
  if(!a){ a=[]; roadGrid.set(k,a); }
  a.push(i + path.i0);   // store absolute index
}
function gridRebuild(){
  roadGrid.clear();
  for(let i=0;i<path.s.length;i++) gridInsert(i);
  gridBuiltFrom = path.s[0];
  gridBuiltTo   = path.s[path.s.length-1];
}
/** nearest-road query. returns {d, y, s} — d = Infinity if beyond `maxD` */
const _q = {d:Infinity, y:0, s:0};
function nearestRoad(x, z, maxD){
  const R  = Math.ceil(maxD/CELL);
  const cx = Math.floor(x/CELL), cz = Math.floor(z/CELL);
  let bd = maxD*maxD, bi = -1;
  for(let dz=-R; dz<=R; dz++)for(let dx=-R; dx<=R; dx++){
    const a = roadGrid.get(gkey(cx+dx, cz+dz));
    if(!a) continue;
    for(let n=0;n<a.length;n++){
      const i = a[n]-path.i0;
      if(i<0 || i>=path.s.length) continue;
      const ddx = path.x[i]-x, ddz = path.z[i]-z;
      const d2 = ddx*ddx+ddz*ddz;
      if(d2 < bd){ bd=d2; bi=i; }
    }
  }
  if(bi<0){ _q.d=Infinity; return _q; }
  _q.d = Math.sqrt(bd);
  _q.y = path.y[bi];
  _q.s = path.s[bi];
  return _q;
}
/** cheap distance to the coarse corridor (used far out, for the mountain mask) */
function corridorDist(x,z){
  const c = path.coarse;
  if(!c.length) return 9999;
  let best = 1e18;
  for(let i=0;i<c.length;i++){
    const dx=c[i].x-x, dz=c[i].z-z;
    const d2=dx*dx+dz*dz;
    if(d2<best) best=d2;
  }
  return Math.sqrt(best);
}

/*═══════════════════════════════════════════════════════════════════════════
  5 · TERRAIN HEIGHT FIELD
═══════════════════════════════════════════════════════════════════════════*/
const CARVE_IN = 7.0, CARVE_OUT = RD.apron;   // must match the road apron

function naturalHeight(x,z,corr){
  // ground detail — several octaves so the near field never reads as a plain
  const detail = fbm(x*0.0052, z*0.0052, 4)*8.2
               + fbm(x*0.0161, z*0.0161, 3)*2.3
               + fbm(x*0.0480, z*0.0480, 2)*0.62;

  // valley walls: the road runs through a cut whose tightness varies along the
  // drive, so the view alternates between enclosed canyon and open vista
  const openness = fbm(x*0.00105, z*0.00105, 3)*0.5 + 0.5;      // 0 tight … 1 open
  const wallAmp  = 16 + 62*(1-openness)*(1-openness);
  const wall     = smooth(21, 175 + openness*260, corr) * wallAmp;
  const wallRock = smooth(30, 150, corr) * ridged(x*0.0072, z*0.0072, 3) * 13 * (1-openness);

  // distant ranges
  const mask = smooth(190, 1050, corr);
  const mtn  = (ridged(x*0.00040, z*0.00040, 5)-0.28) * 1150 * mask*mask;
  const big  = fbm(x*0.00092, z*0.00092, 3) * 175 * mask;

  return detail*(0.85+1.05*mask) + wall + wallRock + mtn + big;
}
/** full terrain height incl. the road corridor carve */
function terrainHeight(x,z,corr){
  const c = (corr===undefined) ? corridorDist(x,z) : corr;
  let h = naturalHeight(x,z,c);
  if(c < CARVE_OUT + 40){
    const q = nearestRoad(x,z, CARVE_OUT+30);
    if(q.d < CARVE_OUT){
      const w = 1 - smooth(CARVE_IN, CARVE_OUT, q.d);
      /* Ditch, pushed out and shallowed. At 0.9 m deep and centred 8.2 m out it
         began less than two metres past the tarmac, so the smallest excursion
         dropped a wheel three feet and fired the car into the air. A mountain
         road has a forgiving verge before it has a drainage channel. */
      const ditch = -0.42 * Math.exp(-Math.pow((q.d-12.0)/4.2, 2));
      h = lerp(h, q.y + ditch - 0.30, w);
    }
  }
  return h;
}

  6 · MATERIALS
═══════════════════════════════════════════════════════════════════════════*/
/* ---- road ---- */
const roadMat = new THREE.MeshStandardMaterial({

roadMat.map.repeat.set((RD.half*2)/3.2, MARK_TILE/3.2);

  sh.uniforms.uMark  = { value: markingsTex };

    '#include <uv_vertex>', '#include <uv_vertex>\n vRUv = uv;');
  sh.fragmentShader = 'uniform sampler2D uMark;\nuniform float uWet;\nvarying vec2 vRUv;\nfloat _mk;\n' +
    sh.fragmentShader
    .replace('#include <map_fragment>', `#include <map_fragment>
      vec4 mk = texture2D(uMark, vRUv);

    .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
      roughnessFactor = mix(roughnessFactor, 0.52, _mk*0.7);

});

/* ---- gravel shoulder ---- */
const vergeMat = new THREE.MeshStandardMaterial({

vergeMat.map.repeat.set(3,3);

/* ---- terrain (grass ⇄ rock ⇄ snow by vertex attribute) ---- */
function makeTerrainMat(){
  const m = new THREE.MeshStandardMaterial({
    color:0xffffff, roughness:0.97, metalness:0.0,
    map:grassFallback, envMapIntensity:0.30, dithering:true });
  m.map.repeat.set(1,1);
  m.onBeforeCompile = fogPatch(sh=>{
    sh.uniforms.tRock  = { value: TER.rockMap };
    sh.uniforms.uSnow  = { value: new THREE.Color(0xd9e2ee) };
    sh.uniforms.uGrass = { value: new THREE.Color(0xffffff) };
    m.userData.sh = sh;
    sh.vertexShader = 'attribute float aRock;\nattribute float aSnow;\nvarying float vRock;\nvarying float vSnow;\nvarying vec2 vWXZ;\n' +
      sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
        vRock = aRock; vSnow = aSnow;
        vWXZ = (modelMatrix * vec4(transformed,1.0)).xz;`);
    sh.fragmentShader = 'uniform sampler2D tRock;\nuniform vec3 uSnow;\nuniform vec3 uGrass;\nvarying float vRock;\nvarying float vSnow;\nvarying vec2 vWXZ;\n' +
      sh.fragmentShader
      .replace('#include <map_fragment>', `
        vec3 cg = texture2D(map, vWXZ * 0.052).rgb * uGrass;
        vec3 cg2= texture2D(map, vWXZ * 0.0121).rgb;
        cg = cg * (0.55 + 0.9*cg2);                       // break up the tiling
        vec3 cr = texture2D(tRock, vWXZ * 0.021).rgb;
        vec3 base = mix(cg, cr*1.05, vRock);
        // km-scale biome drift: meadow, dry pasture and scorched scree.
        // Without it the whole valley is one flat khaki and reads synthetic.
        float bio = texture2D(map, vWXZ * 0.00042).r;
        float bio2= texture2D(map, vWXZ * 0.00131).g;
        vec3 lush = base * vec3(0.70, 1.00, 0.60);
        // warm sun on a warm-tinted ground drove the whole valley to one red,
        // so the dry biome keeps some blue and yields more ground to the lush one
        vec3 dry  = base * vec3(1.08, 1.00, 0.78);
        vec3 ash  = base * vec3(0.86, 0.83, 0.84);
        base = mix(base, lush, smoothstep(0.26, 0.66, bio)*0.92);
        base = mix(base, dry , smoothstep(0.58, 0.20, bio)*0.52);
        base = mix(base, ash , smoothstep(0.58, 0.86, bio2)*0.45);
        base = mix(base, uSnow, vSnow);
        diffuseColor.rgb *= base;`)
      .replace('#include <roughnessmap_fragment>', `
        float roughnessFactor = mix(0.98, 0.86, vRock);
        roughnessFactor = mix(roughnessFactor, 0.72, vSnow);`)
      /* The LOD mesh carries nothing but vertex normals, so every hillside
         shades as one broad gradient and the ground reads as painted card.
         Deriving a bump from the albedo's own luminance buys micro-relief for
         two extra samples and no new asset. Faded out with distance, because
         perturbing normals under a shrinking texel footprint only aliases. */
      .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
        #ifdef USE_FOG
          float bAtt = 1.0 - smoothstep(60.0, 340.0, vFogDepth);
        #else
          float bAtt = 1.0;
        #endif
        if(bAtt > 0.004){
          const vec3 LW = vec3(0.299, 0.587, 0.114);
          vec2 uvB = vWXZ * 0.052;
          float e  = 0.055;
          float h0 = dot(texture2D(map, uvB).rgb, LW);
          float hx = dot(texture2D(map, uvB + vec2(e, 0.0)).rgb, LW);
          float hz = dot(texture2D(map, uvB + vec2(0.0, e)).rgb, LW);
          vec3 dW  = vec3(h0 - hx, 0.0, h0 - hz) * (mix(3.4, 1.5, vRock) * bAtt);
          normal   = normalize(normal + (viewMatrix * vec4(dW, 0.0)).xyz);
        }`);
  });
  m.customProgramCacheKey = ()=> 'terr-blend';
  return m;
}
const TER = { rockMap: rockFallback };
const terrainMat = makeTerrainMat();
streamMap('aerial_grass_rock','diff', THREE.SRGBColorSpace, t=>{
  terrainMat.map=t; terrainMat.needsUpdate=true;
  if(terrainMat.userData.sh) terrainMat.userData.sh.uniforms.map = {value:t};
});
streamMap('aerial_grass_rock','nor_gl', null, t=>{
  t.repeat.set(26,26); terrainMat.normalMap=t;
  terrainMat.normalScale.set(0.7,0.7); terrainMat.needsUpdate=true; });
streamMap('rock_face_03','diff', THREE.SRGBColorSpace, t=>{
  TER.rockMap = t;

/* far terrain — vertex colours only, no texture fetches */
const farTerrainMat = new THREE.MeshStandardMaterial({
  vertexColors:true, roughness:0.99, metalness:0, envMapIntensity:0.26, dithering:true });

/*═══════════════════════════════════════════════════════════════════════════
  7 · ROAD RIBBON CHUNKS
═══════════════════════════════════════════════════════════════════════════*/
const CHUNK_SAMPLES = 24;                       // 72 m
const CHUNK_LEN = CHUNK_SAMPLES*RD.step;
const roadGroup = new THREE.Group(); scene.add(roadGroup);

/* lateral profile: |n| positions across the ribbon */
const PROF_ROAD  = [];   for(let i=0;i<=10;i++) PROF_ROAD.push(-RD.half + (RD.half*2)*i/10);
const PROF_VERGE = [RD.half, RD.half+0.9, RD.verge];
const PROF_APRON = [RD.verge, 8.4, 10.8, 14, 17, RD.apron];

const guardMat = new THREE.MeshStandardMaterial({
  color:0x9aa1a8, roughness:0.58, metalness:0.82, envMapIntensity:0.52 });
const postMat  = new THREE.MeshStandardMaterial({
  color:0x6d7278, roughness:0.6, metalness:0.85, envMapIntensity:0.8 });

function buildRibbon(sStart, offs, uvMode){
  const rows = CHUNK_SAMPLES+1, cols = offs.length;
  const pos = new Float32Array(rows*cols*3);
  const nor = new Float32Array(rows*cols*3);
  const uv  = new Float32Array(rows*cols*2);
  const idx = [];
  const P = {x:0,y:0,z:0};
  for(let r=0;r<rows;r++){
    const s = sStart + r*RD.step;
    const f = frameAt(s);
    const cs = Math.cos(f.h), sn = Math.sin(f.h);
    for(let c=0;c<cols;c++){
      const n = offs[c];
      const i3=(r*cols+c)*3, i2=(r*cols+c)*2;
      let y;
      if(uvMode===2){  // apron: blend road shoulder → natural terrain
        const w = 1 - smooth(CARVE_IN, CARVE_OUT, Math.abs(n));
        const wx = f.x+cs*n, wz = f.z-sn*n;
        const nat = naturalHeight(wx, wz, corridorDist(wx,wz));
        const ditch = -0.9*Math.exp(-Math.pow((Math.abs(n)-8.2)/3.4,2));
        y = lerp(nat, f.y + n*f.b + ditch - 0.30, w) - 0.02;
      } else {
        y = roadSurfaceY(f, n);
      }
      pos[i3]   = f.x+cs*n;
      pos[i3+1] = y;
      pos[i3+2] = f.z-sn*n;
      if(uvMode===0){ uv[i2]=(n+RD.half)/(RD.half*2); uv[i2+1]=s/MARK_TILE; }
      else          { uv[i2]=n/4.0;                   uv[i2+1]=s/4.0; }
    }
  }
  for(let r=0;r<rows-1;r++)for(let c=0;c<cols-1;c++){
    const a=r*cols+c, b=a+1, d=a+cols, e=d+1;
    idx.push(a,d,b, b,d,e);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('uv', new THREE.BufferAttribute(uv,2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function buildGuard(sStart, sideSign){
  // W-beam profile: [height, outward]
  const prof = [[0.44,0.0],[0.53,0.055],[0.63,0.018],[0.73,0.055],[0.82,0.0]];
  const rows = CHUNK_SAMPLES+1, cols = prof.length;
  const pos = new Float32Array(rows*cols*3), idx=[];
  const nOff = sideSign*(RD.verge-0.35);
  for(let r=0;r<rows;r++){
    const s = sStart + r*RD.step;
    const f = frameAt(s);
    const cs=Math.cos(f.h), sn=Math.sin(f.h);
    const baseY = roadSurfaceY(f, nOff);
    for(let c=0;c<cols;c++){
      const [hgt,out] = prof[c];
      const n = nOff + sideSign*out;
      const i3=(r*cols+c)*3;
      pos[i3]=f.x+cs*n; pos[i3+1]=baseY+hgt; pos[i3+2]=f.z-sn*n;
    }
  }
  for(let r=0;r<rows-1;r++)for(let c=0;c<cols-1;c++){
    const a=r*cols+c,b=a+1,d=a+cols,e=d+1;
    if(sideSign>0) idx.push(a,d,b, b,d,e); else idx.push(a,b,d, b,e,d);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
const postGeo = new THREE.BoxGeometry(0.11,1.0,0.16);

const roadChunks = new Map();   // chunkIndex -> {group}
function chunkIndexOf(s){ return Math.floor(s/CHUNK_LEN); }

function makeRoadChunk(ci){
  const s0 = ci*CHUNK_LEN;
  const grp = new THREE.Group();

  const mRoad = new THREE.Mesh(buildRibbon(s0, PROF_ROAD, 0), roadMat);
  mRoad.receiveShadow = true; mRoad.name='road'; grp.add(mRoad);

  for(const sgn of [-1,1]){
    const offs = PROF_VERGE.map(v=>v*sgn);
    if(sgn<0) offs.reverse();
    const mv = new THREE.Mesh(buildRibbon(s0, offs, 1), vergeMat);
    mv.receiveShadow = true; mv.name='verge'; grp.add(mv);
    const offsA = PROF_APRON.map(v=>v*sgn);
    if(sgn<0) offsA.reverse();
    const ma = new THREE.Mesh(buildRibbon(s0, offsA, 2), terrainMat);
    ma.receiveShadow = true; ma.name='apron'; grp.add(ma);
  }

  // guardrail on the outside of anything tight
  let kMax=0, kSign=0;
  for(let r=0;r<=CHUNK_SAMPLES;r++){
    const k = curvatureAt(s0+r*RD.step);
    if(Math.abs(k) > Math.abs(kMax)){ kMax=k; }
  }
  if(Math.abs(kMax) > 0.0088){
    kSign = kMax>0 ? -1 : 1;          // outside of the turn
    const rail = new THREE.Mesh(buildGuard(s0, kSign), guardMat);
    rail.castShadow = true; rail.receiveShadow = true; rail.name='rail'; grp.add(rail);
    const nPosts = Math.floor(CHUNK_LEN/4);
    const posts = new THREE.InstancedMesh(postGeo, postMat, nPosts);
    posts.castShadow = true;
    const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), E = new THREE.Euler();
    const V = new THREE.Vector3(), Sc = new THREE.Vector3(1,1,1);
    for(let p=0;p<nPosts;p++){
      const s = s0 + p*4 + 2;
      const f = frameAt(s);
      const n = kSign*(RD.verge-0.35);
      const cs=Math.cos(f.h), sn=Math.sin(f.h);
      V.set(f.x+cs*n, roadSurfaceY(f,n)+0.42, f.z-sn*n);
      E.set(0, f.h, 0); Q.setFromEuler(E);
      M.compose(V,Q,Sc); posts.setMatrixAt(p,M);
    }
    posts.instanceMatrix.needsUpdate = true;
    posts.name='posts'; grp.add(posts);
  }
  roadGroup.add(grp);
  return { grp };
}
function disposeGroup(g){
  g.traverse(o=>{ if(o.geometry) o.geometry.dispose(); });
  g.removeFromParent();
}

/*═══════════════════════════════════════════════════════════════════════════
  8 · TERRAIN TILES (3 LOD rings)
═══════════════════════════════════════════════════════════════════════════*/
const RINGS = [
  { size: 110, seg: 30, seg0: 30, rad: 3, far:false, skirt: 6  },   // ±385 m, 3.7 m/vert
  { size: 380, seg: 20, seg0: 20, rad: 3, far:false, skirt: 40 },   // ±1330 m, 19 m/vert
  { size:1250, seg: 14, seg0: 14, rad: 3, far:true , skirt:220 },   // ±4375 m
];
const terrainGroup = new THREE.Group(); scene.add(terrainGroup);
const tiles = new Map();          // "ring:tx:tz" -> mesh
const buildQueue = [];

function tileKey(r,tx,tz){ return r+':'+tx+':'+tz; }

function buildTile(ring, tx, tz){
  const R = RINGS[ring];
  const seg = R.seg, size = R.size;
  const ox = tx*size, oz = tz*size;
  const n = seg+1;
  const total = n*n;
  const pos = new Float32Array(total*3);
  const uv  = new Float32Array(total*2);
  const aRock = new Float32Array(total);
  const aSnow = new Float32Array(total);
  const col = R.far ? new Float32Array(total*3) : null;
  const idx = [];
  const hs = new Float32Array(total);

  for(let j=0;j<n;j++)for(let i=0;i<n;i++){
    const k = j*n+i;
    const x = ox + (i/seg)*size, z = oz + (j/seg)*size;
    const corr = corridorDist(x,z);
    const h = R.far ? naturalHeight(x,z,corr) : terrainHeight(x,z,corr);
    hs[k]=h;
    pos[k*3]=x; pos[k*3+1]=h; pos[k*3+2]=z;
    uv[k*2]=x/12; uv[k*2+1]=z/12;
  }
  // slope → rock, altitude → snow
  const cellW = size/seg;
  for(let j=0;j<n;j++)for(let i=0;i<n;i++){
    const k=j*n+i;
    const hL=hs[j*n+Math.max(0,i-1)], hR=hs[j*n+Math.min(n-1,i+1)];
    const hD=hs[Math.max(0,j-1)*n+i], hU=hs[Math.min(n-1,j+1)*n+i];
    const gx=(hR-hL)/(2*cellW), gz=(hU-hD)/(2*cellW);
    const slope = Math.sqrt(gx*gx+gz*gz);
    const h = hs[k];
    const rk = smooth(0.38, 0.92, slope) * 0.94 + smooth(120, 300, h)*0.5;
    const sn = smooth(255, 430, h) * (1 - smooth(0.95,1.7,slope)*0.75);
    aRock[k]=clamp(rk,0,1); aSnow[k]=clamp(sn,0,1);
    if(col){
      const g = new THREE.Color();
      g.setRGB(0.085,0.115,0.055);
      const rock = new THREE.Color(0.135,0.125,0.115);
      const snow = new THREE.Color(0.80,0.84,0.90);
      g.lerp(rock, clamp(rk,0,1)); g.lerp(snow, clamp(sn,0,1));
      col[k*3]=g.r; col[k*3+1]=g.g; col[k*3+2]=g.b;
    }
  }
  for(let j=0;j<seg;j++)for(let i=0;i<seg;i++){
    const a=j*n+i, b=a+1, c=a+n, d=c+1;
    idx.push(a,c,b, b,c,d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('uv', new THREE.BufferAttribute(uv,2));
  if(col) g.setAttribute('color', new THREE.BufferAttribute(col,3));
  else {
    g.setAttribute('aRock', new THREE.BufferAttribute(aRock,1));
    g.setAttribute('aSnow', new THREE.BufferAttribute(aSnow,1));
  }
  g.setIndex(idx);
  g.computeVertexNormals();

  const mesh = new THREE.Mesh(g, R.far ? farTerrainMat : terrainMat);
  mesh.receiveShadow = !R.far;
  mesh.userData.ring = ring;
  mesh.userData.seg = seg;
  mesh.userData.tx = tx; mesh.userData.tz = tz;
  mesh.userData.heights = hs;
  mesh.name = 'terrain'+ring;
  terrainGroup.add(mesh);
  return mesh;
}

function updateTiles(cx, cz){
  const want = new Set();
  for(let r=0;r<RINGS.length;r++){
    const R = RINGS[r];
    const ctx = Math.floor(cx/R.size), ctz = Math.floor(cz/R.size);
    for(let dz=-R.rad; dz<=R.rad; dz++)for(let dx=-R.rad; dx<=R.rad; dx++){
      const tx=ctx+dx, tz=ctz+dz;
      // skip if fully covered by a finer ring
      if(r>0){
        const F = RINGS[r-1];
        const fx0=Math.floor(cx/F.size)-F.rad, fx1=Math.floor(cx/F.size)+F.rad;
        const fz0=Math.floor(cz/F.size)-F.rad, fz1=Math.floor(cz/F.size)+F.rad;
        const covX0=fx0*F.size, covX1=(fx1+1)*F.size;
        const covZ0=fz0*F.size, covZ1=(fz1+1)*F.size;
        if(tx*R.size>=covX0 && (tx+1)*R.size<=covX1 &&
           tz*R.size>=covZ0 && (tz+1)*R.size<=covZ1) continue;
      }
      const key=tileKey(r,tx,tz);
      want.add(key);
      if(!tiles.has(key)){
        tiles.set(key,'pending');
        buildQueue.push({r,tx,tz,key,
          d: Math.hypot((tx+0.5)*R.size-cx,(tz+0.5)*R.size-cz)});
      }
    }
  }
  for(const [key,m] of tiles){
    if(!want.has(key)){
      if(m!=='pending'){ m.geometry.dispose(); m.removeFromParent(); scatterDrop(key); }
      tiles.delete(key);
    }
  }
  buildQueue.sort((a,b)=>a.d-b.d);
}
/* Meshing a tile and scattering its vegetation are both several milliseconds,
   and doing them back to back — twice, at the old budget of two tiles a frame —
   is a quarter-second stall right as you enter a corner. They go in separate
   queues so a frame pays for at most one of each. */
const scatterQueue = [];
function drainQueue(budget, scatterBudget){
  let n=0;
  while(buildQueue.length && n<budget){
    const t = buildQueue.shift();
    const cur = tiles.get(t.key);
    // a replacement keeps its old mesh on screen until the new one exists, so
    // the map holds a live mesh rather than the 'pending' marker
    if(t.replace ? (cur===undefined || cur==='pending') : cur!=='pending') continue;
    const mesh = buildTile(t.r,t.tx,t.tz);
    if(t.replace){ cur.geometry.dispose(); cur.removeFromParent(); }
    tiles.set(t.key, mesh);
    // the scatter is derived from world position, not from the mesh, so a
    // re-meshed tile keeps the vegetation it already has
    if(t.r===0 && !t.replace) scatterQueue.push(t);
    n++;
  }
  const sb = scatterBudget===undefined ? budget : scatterBudget;
  let m=0;
  while(scatterQueue.length && m<sb){
    const t = scatterQueue.shift();
    if(!tiles.has(t.key)) continue;               // streamed back out while queued
    scatterTile(t.key, tiles.get(t.key), t.tx, t.tz, RINGS[0].size);
    m++;
  }
}

/*═══════════════════════════════════════════════════════════════════════════
  9 · VEGETATION  (instanced pines, broadleaf, rocks, grass tufts)
═══════════════════════════════════════════════════════════════════════════*/
/** merge a list of geometries (indexed or not) into one indexed BufferGeometry */
function mergeGeos(list){
  let vc=0, ic=0;
  for(const g of list){
    const n = g.attributes.position.count;
    vc += n;
    ic += g.index ? g.index.count : n;
  }
  const pos=new Float32Array(vc*3), nor=new Float32Array(vc*3), uv=new Float32Array(vc*2);
  const idx=new Uint32Array(ic);
  let vo=0, io=0;
  for(const g of list){
    const n = g.attributes.position.count;
    pos.set(g.attributes.position.array, vo*3);
    if(g.attributes.normal) nor.set(g.attributes.normal.array, vo*3);
    if(g.attributes.uv)     uv.set(g.attributes.uv.array, vo*2);
    if(g.index){
      const gi=g.index.array;
      for(let i=0;i<gi.length;i++) idx[io+i]=gi[i]+vo;
      io += gi.length;
    } else {
      for(let i=0;i<n;i++) idx[io+i]=i+vo;
      io += n;
    }
    vo += n;
  }
  const out=new THREE.BufferGeometry();
  out.setAttribute('position',new THREE.BufferAttribute(pos,3));
  out.setAttribute('normal',new THREE.BufferAttribute(nor,3));
  out.setAttribute('uv',new THREE.BufferAttribute(uv,2));
  out.setIndex(new THREE.BufferAttribute(idx,1));
  return out;
}

const trunkMat = new THREE.MeshStandardMaterial({
  color:0x6a5342, roughness:0.95, metalness:0, map:barkFallback, envMapIntensity:0.40 });
trunkMat.map.repeat.set(1,2);
streamMap('bark_willow','diff', THREE.SRGBColorSpace, t=>{
  t.repeat.set(1,2); trunkMat.map=t; trunkMat.color.setHex(0xc8b49c); trunkMat.needsUpdate=true; });

/* Leaf spray atlases. A canopy built from solid blobs reads as blobs no matter
   how much the silhouette is roughened, because the interior shades as one
   smooth surface. Cards carrying an alpha spray are what every real-time tree
   uses, and they cost fewer triangles than the spheres they replace. */
/* One 512×256 atlas: needle sprays on the left half, broadleaf on the right.
   Conifers and broadleaves need different sprays, but splitting them into two
   materials would double the draw calls and the shader patching — baking the
   half-selection into each geometry's UVs keeps it to one of each. */
const LEAF_NEEDLE = 0, LEAF_BROAD = 1;
const leafAtlas = canvasTex(512,256,(g,W,H)=>{
  g.clearRect(0,0,W,H);
  const w = W/2, h = H;
  for(let s=0;s<26;s++){
    const bx = 22 + hashI(s,3)*(w-44), by = h - 6 - hashI(s,5)*20;
    const len = h*(0.52+hashI(s,7)*0.44), spread = 0.44+hashI(s,11)*0.32;
    const tilt = (hashI(s,13)-0.5)*0.66;
    for(let n=0;n<30;n++){
      const t = n/29, side = n%2 ? 1 : -1;
      const ny = by - len*t;
      const nl = 15*(1-t*0.70)*(0.68+hashI(s*31+n,17)*0.64);
      g.strokeStyle = `hsla(${116+hashI(s*7+n,19)*28},${32+hashI(n,23)*22}%,${10+t*24}%,1)`;
      g.lineWidth = 1.6;
      g.beginPath(); g.moveTo(bx+tilt*len*t, ny);
      g.lineTo(bx+tilt*len*t + side*nl*spread, ny + nl*0.5);
      g.stroke();
    }
  }
  /* Pack the broadleaf spray into an overlapping cluster around the middle of
     the card. Scattering leaves evenly across the whole tile leaves each card
     ~70% empty, and a crown built from those reads as a swarm of dark flakes
     rather than dense foliage. */
  for(let s=0;s<150;s++){
    const ang = hashI(s,41)*Math.PI*2;
    const rad = Math.pow(hashI(s,43), 0.62) * 0.46;
    const cx = w*1.5 + Math.cos(ang)*rad*w, cy = h*0.5 + Math.sin(ang)*rad*h;
    const rx = 7 + hashI(s,7)*13, ry = rx*(0.44+hashI(s,11)*0.34);
    const lum = 17 + hashI(s,17)*32;
    g.save(); g.translate(cx,cy); g.rotate(hashI(s,13)*Math.PI*2);
    const grd = g.createLinearGradient(-rx,0,rx,0);
    grd.addColorStop(0, `hsla(${94+hashI(s,19)*30},${26+hashI(s,23)*26}%,${lum}%,1)`);
    grd.addColorStop(1, `hsla(${86+hashI(s,29)*30},${30+hashI(s,31)*24}%,${lum+13}%,1)`);
    g.fillStyle = grd;
    // a pointed oval reads as a leaf where a plain ellipse reads as a pebble
    g.beginPath(); g.moveTo(-rx,0);
    g.quadraticCurveTo(0,-ry, rx,0);
    g.quadraticCurveTo(0, ry, -rx,0);
    g.fill(); g.restore();
  }
},{repeat:false});
/** Squeeze a card's UVs into one half of the leaf atlas. */
function leafUV(g, half){
  const uv = g.attributes.uv;
  for(let i=0;i<uv.count;i++) uv.setX(i, uv.getX(i)*0.5 + half*0.5);
  uv.needsUpdate = true;
  return g;
}

const leafMat = new THREE.MeshStandardMaterial({
  color:0xffffff, map:leafAtlas, roughness:0.93, metalness:0, envMapIntensity:0.46,
  alphaTest:0.42, side:THREE.DoubleSide });
leafMat.onBeforeCompile = fogPatch(sh=>{
  sh.uniforms.uTime = { value:0 };
  sh.uniforms.uSunDir = { value:new THREE.Vector3(0,1,0) };
  sh.uniforms.uSunCol = { value:new THREE.Color(0,0,0) };
  leafMat.userData.sh = sh;
  sh.vertexShader = 'uniform float uTime;\nvarying float vCanY;\nvarying vec3 vObj;\nvarying vec3 vWPos;\n' + sh.vertexShader.replace(
    '#include <begin_vertex>', `#include <begin_vertex>
      #ifdef USE_INSTANCING
        float ph = instanceMatrix[3].x*0.6 + instanceMatrix[3].z*0.4;
      #else
        float ph = 0.0;
      #endif
      float hgt = max(position.y, 0.0);
      vCanY = clamp(hgt/7.0, 0.0, 1.0);
      vObj  = position;
      transformed.x += sin(uTime*1.05 + ph)*0.035*hgt;
      transformed.z += cos(uTime*0.83 + ph*1.3)*0.028*hgt;`)
    .replace('#include <worldpos_vertex>', `#include <worldpos_vertex>
      #ifdef USE_INSTANCING
        vWPos = (modelMatrix * instanceMatrix * vec4(transformed,1.0)).xyz;
      #else
        vWPos = (modelMatrix * vec4(transformed,1.0)).xyz;
      #endif`);
  // canopies are dark and cool at the base, warmer where the sun reaches
  sh.fragmentShader = 'varying float vCanY;\nvarying vec3 vObj;\nvarying vec3 vWPos;\n'+
    'uniform vec3 uSunDir;\nuniform vec3 uSunCol;\n'+
    'float lh3(vec3 p){ return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453); }\n'+
    `float vn3(vec3 p){
       vec3 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
       float a=mix(lh3(i),             lh3(i+vec3(1,0,0)), f.x);
       float b=mix(lh3(i+vec3(0,1,0)), lh3(i+vec3(1,1,0)), f.x);
       float c=mix(lh3(i+vec3(0,0,1)), lh3(i+vec3(1,0,1)), f.x);
       float d=mix(lh3(i+vec3(0,1,1)), lh3(i+vec3(1,1,1)), f.x);
       return mix(mix(a,b,f.y), mix(c,d,f.y), f.z);
     }\n`+
    sh.fragmentShader.replace(
    '#include <color_fragment>', `#include <color_fragment>
      diffuseColor.rgb *= mix(0.42, 1.12, pow(vCanY, 0.85));
      /* Chew clump-shaped holes through the outer shell. A roughened sphere is
         still unmistakably a sphere — what makes a canopy read as foliage is a
         ragged, light-permeable silhouette, and punching the alpha is far
         cheaper than the geometry it would otherwise take. Two octaves of
         smooth noise, never a floored lattice: quantising object space carves
         axis-aligned cubes, which is worse than the sphere it replaced. */
      // thin the spray toward the outside so the crown does not end on a hard
      // shell; the card alpha does the rest of the silhouette work
      float rad   = length(vObj.xz) * 0.40 + abs(vObj.y - 4.2) * 0.14;
      float clump = vn3(vObj * 1.7) * 0.62 + vn3(vObj * 5.1) * 0.38;
      if(clump < smoothstep(1.00, 1.55, rad) * 0.42) discard;`)
    .replace('#include <opaque_fragment>', `
      /* Leaves are thin and translucent, so a canopy between you and a low sun
         lights up instead of going to silhouette. Without this every tree at
         golden hour is a black cut-out and the frame loses its best light. */
      vec3 vDir = normalize(vWPos - cameraPosition);
      float back = pow(max(dot(vDir, -uSunDir), 0.0), 3.4);
      outgoingLight += diffuseColor.rgb * uSunCol * back * 2.6 * (0.35 + 0.65*vCanY);
      #include <opaque_fragment>`);
});
leafMat.customProgramCacheKey = ()=>'leaf-sway';

/* ---- trunk + canopy geometries ----------------------------------------
   Perfect cones and spheres are the giveaway that a forest is programmer
   art, so every tier gets jittered and the vertices are pushed around by
   noise to rough up the silhouette.                                      */
function roughen(g, amp, freq, seed){
  const p = g.attributes.position;
  for(let i=0;i<p.count;i++){
    const x=p.getX(i), y=p.getY(i), z=p.getZ(i);
    const r = Math.hypot(x,z);
    const n = vnoise(x*freq+seed, z*freq-seed) + 0.5*vnoise(y*freq*1.7-seed, x*freq*1.7+seed);
    const k = 1 + n*amp;
    p.setXYZ(i, x*k, y*(1+n*amp*0.35), z*k);
    if(r < 1e-4) p.setXYZ(i, x, y*(1+n*amp*0.5), z);
  }
  g.computeVertexNormals();
  return g;
}
/** Point every vertex normal outward from the crown centre (blended up) so a
    loose pile of randomly-spun quads shades like one soft volume of foliage
    instead of a hundred independently-lit flat chips. */
function canopyNormals(g, cy, upBias){
  const p = g.attributes.position, n = g.attributes.normal;
  for(let i=0;i<p.count;i++){
    let x=p.getX(i), y=p.getY(i)-cy, z=p.getZ(i);
    const L = Math.hypot(x,y,z) || 1;
    x/=L; y/=L; z/=L;
    y += upBias;
    const M = Math.hypot(x,y,z) || 1;
    n.setXYZ(i, x/M, y/M, z/M);
  }
  n.needsUpdate = true;
  return g;
}
/* Open-ended: the cap discs at the top and bottom of a trunk are buried in the
   canopy and the ground respectively, and they double the triangle count. */
const G_trunk_pine = (()=>{ const g=new THREE.CylinderGeometry(0.09,0.27,2.6,6,1,true); g.translate(0,1.3,0); return g; })();
const G_leaf_pine  = (()=>{
  const l=[];
  // drooping sprays ringed around each tier: a conifer is a stack of branch
  // fans, and a smooth cone is the single clearest tell of a procedural forest
  const spec=[[1.85,2.05],[2.85,1.86],[3.80,1.55],[4.65,1.20],[5.35,0.84],[5.95,0.48]];
  let k=0;
  for(const [y,r] of spec){
    // fewer, larger sprays: the crown's silhouette comes from the outermost
    // cards, and thirty of the sixty-three were interior fill nobody ever saw
    const cnt = Math.max(5, Math.round(r*5.2));
    for(let i=0;i<cnt;i++){
      const a = (i/cnt)*TAU + k*0.83 + hash1(k*31+i*7)*0.55;
      const s = r*(1.54+hash1(k*17+i*3)*0.46);
      const q = leafUV(new THREE.PlaneGeometry(s, s*0.80), LEAF_NEEDLE);
      q.rotateX(0.62 + hash1(k*11+i)*0.30);      // droop
      q.rotateY(a);
      q.translate(Math.sin(a)*r*0.52, y + (hash1(k*23+i)-0.5)*0.24, Math.cos(a)*r*0.52);
      l.push(q);
    }
    k++;
  }
  return canopyNormals(mergeGeos(l), 3.6, 0.55);
})();
const G_trunk_oak = (()=>{
  const l=[];
  const t = new THREE.CylinderGeometry(0.15,0.36,2.9,6,1,true); t.translate(0,1.45,0); l.push(t);
  for(const [a,ln] of [[0.7,1.5],[2.5,1.3],[4.6,1.4]]){
    const b = new THREE.CylinderGeometry(0.07,0.13,ln,4,1,true);
    b.translate(0,ln*0.5,0);
    b.rotateX(0.55); b.rotateY(a); b.translate(0,2.5,0);
    l.push(b);
  }
  return mergeGeos(l);
})();
const G_leaf_oak = (()=>{
  const l=[];
  const CY = 4.25, RX = 2.95, RY = 1.95, RZ = 2.85;
  // cards scattered through a shell rather than only on it — a hollow crown
  // shows daylight straight through the middle from a low camera
  for(let i=0;i<58;i++){
    const u = hash1(i*7.1+3), v = hash1(i*13.3+5), w = hash1(i*19.7+11);
    const th = u*TAU, ph = Math.acos(2*v-1), rr = 0.46 + 0.54*Math.sqrt(w);
    const x = Math.sin(ph)*Math.cos(th)*RX*rr;
    const y = Math.cos(ph)*RY*rr;
    const z = Math.sin(ph)*Math.sin(th)*RZ*rr;
    const s = 1.04 + hash1(i*29.1+7)*1.06;
    const q = leafUV(new THREE.PlaneGeometry(s, s*0.86), LEAF_BROAD);
    q.rotateZ(hash1(i*31.3+2)*TAU);
    q.rotateX((hash1(i*37.7+4)-0.5)*2.4);
    q.rotateY(hash1(i*41.9+6)*TAU);
    q.translate(x, CY+y, z);
    l.push(q);
  }
  return canopyNormals(mergeGeos(l), CY, 0.42);
})();
const G_rock = (()=>{
  const g=new THREE.IcosahedronGeometry(1,1);
  const p=g.attributes.position;
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),y=p.getY(i),z=p.getZ(i);
    const d=0.68+0.5*Math.abs(vnoise(x*1.7+9,z*1.7+3))+0.28*Math.abs(vnoise(y*2.3,x*2.3));
    p.setXYZ(i,x*d,y*d*0.68,z*d);
  }
  g.computeVertexNormals(); return g;
})();
const rockMat = new THREE.MeshStandardMaterial({
  color:0x8d8880, roughness:0.94, metalness:0, envMapIntensity:0.30, map:rockFallback });
rockMat.map.repeat.set(0.6,0.6);
streamMap('rock_face_03','diff', THREE.SRGBColorSpace, t=>{
  t.repeat.set(0.55,0.55); rockMat.map=t; rockMat.color.setHex(0xffffff); rockMat.needsUpdate=true; });
streamMap('rock_face_03','nor_gl', null, t=>{
  t.repeat.set(0.55,0.55); rockMat.normalMap=t; rockMat.needsUpdate=true; });

/* ---- grass tuft card ---- */
const grassCardTex = canvasTex(256,256,(g,w,h)=>{
  g.clearRect(0,0,w,h);
  // many thin blades rather than a few fat ones: at 16 wide strokes the card
  // resolves into visible spikes as soon as it is anywhere near the camera
  for(let b=0;b<46;b++){
    const x0 = 6 + hashI(b,3)*(w-12);
    const bw = 1.6 + hashI(b,9)*3.4;
    const bh = h*(0.36+hashI(b,17)*0.60);
    const bend = (hashI(b,23)-0.5)*44;
    const grd = g.createLinearGradient(0,h,0,h-bh);
    const hue = 72 + hashI(b,31)*30;
    grd.addColorStop(0,    `hsla(${hue},38%,20%,1)`);
    grd.addColorStop(0.55, `hsla(${hue+8},48%,40%,1)`);
    // sun-bleached tips are most of what sells grass at a distance
    grd.addColorStop(1,    `hsla(${hue+22},56%,63%,1)`);
    g.fillStyle=grd;

    const jx = hash1(seed*3+1), jz = hash1(seed*3+2), pick = hash1(seed*3+5);
    const x = tx*size + (i+jx)*step, z = tz*size + (j+jz)*step;
    const corr = corridorDist(x,z);
    if(corr > 340) continue;                        // keep it near the drive
    const q = nearestRoad(x,z,70);
    const d = q.d;
    if(d < 8.6) continue;                           // off the tarmac
    // two-scale mask → dense stands with real clearings, not an even sprinkle
    const can = canopyAt(q.s);

    const clump  = fbm(x*0.0094 , z*0.0094 , 2)*0.5+0.5;

    // soft ramp averaged everything into the same thin sprinkle everywhere
    const base   = smooth(0.40, 0.58, stand) * smooth(0.20, 0.52, clump);
    // world noise says where stands *can* sit, canopy says whether this stretch
    // of road is a tunnel or a lookout

    // in a tunnel the treeline crowds the verge, which is the only thing that
    // gives speed a sense of scale; on a lookout it stands back off the view
    const nearOK = lerp(17.0, 8.2, can);

       slope test alone costs four terrainHeight evaluations, and at 4.6 m
       spacing that was ~2300 of them per tile for samples that mostly reject —
       which is what makes a tile boundary land as a visible hitch. */
    const wantTree = d>nearOK && pick < forest*0.86;
    const wantRock = !wantTree && pick > 0.972;
    const wantGrass = d < 34 && d > 7.4;
    if(wantTree || wantRock){
      const e=2.2;
      const hx=(terrainHeight(x+e,z,corr)-terrainHeight(x-e,z,corr))/(2*e);
      const hz=(terrainHeight(x,z+e,corr)-terrainHeight(x,z-e,corr))/(2*e);

        const y = terrainHeight(x,z,corr);

        out.rock.push(x,y-sc*0.22,z,sc,hash1(seed*23)*TAU);

      for(let gI=0; gI<3; gI++){

      vTw = 0.72 + 0.28*sin(uTime*2.1 + ph);
      gl_PointSize = aSize * vTw * uPx;
    }`,
  fragmentShader:`
    uniform float uOpacity;
    varying vec3 vC; varying float vTw;
    void main(){
      // analytic falloff: crisp core plus halo, stable at any point size
      vec2 d = gl_PointCoord - 0.5;
      float a = exp(-dot(d,d)*26.0);
      gl_FragColor = vec4(vC * vTw * 2.6, a*uOpacity);
    }`,

});

/* ---- cloud deck -----------------------------------------------------------
   A dome cap carrying a raymarch-lite fBm deck. Density is marched a few
   steps toward the sun for self-shadowing, which is what gives sunset cloud
   its lit rim and bruised underside — a flat noise texture never does.     */
const cloudMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, depthTest:true, fog:false,
  side:THREE.BackSide, blending:THREE.NormalBlending,
  uniforms:{
    uTime:{value:0}, uSun:{value:new THREE.Vector3(0,1,0)},
    uSunCol:{value:new THREE.Color(1,0.8,0.6)}, uSkyCol:{value:new THREE.Color(0.4,0.5,0.7)},
    uAmb:{value:new THREE.Color(0.3,0.34,0.42)},
    uCover:{value:0.50}, uOpacity:{value:1.0}, uNight:{value:0.0},
  },
  vertexShader:`varying vec3 vDir;
    void main(){
      vDir = normalize(position);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
      gl_Position.z = gl_Position.w;                  // park it on the far plane
    }`,
  fragmentShader:`
    varying vec3 vDir;
    uniform float uTime, uCover, uOpacity, uNight;
    uniform vec3 uSun, uSunCol, uSkyCol, uAmb;

    vec2 h2(vec2 p){
      p = vec2(dot(p,vec2(127.1,311.7)), dot(p,vec2(269.5,183.3)));
      return fract(sin(p)*43758.5453)*2.0-1.0;
    }
    float vn(vec2 p){
      vec2 i=floor(p), f=fract(p);
      vec2 u=f*f*(3.0-2.0*f);
      return mix(mix(dot(h2(i+vec2(0,0)),f-vec2(0,0)), dot(h2(i+vec2(1,0)),f-vec2(1,0)), u.x),
                 mix(dot(h2(i+vec2(0,1)),f-vec2(0,1)), dot(h2(i+vec2(1,1)),f-vec2(1,1)), u.x), u.y);
    }
    float fbm(vec2 p){
      float s=0.0, a=0.5;
      mat2 R = mat2(0.80,0.60,-0.60,0.80);
      for(int i=0;i<6;i++){ s += a*vn(p); p = R*p*2.03; a*=0.5; }
      return s;
    }
    // density of the deck along a flat-earth projection of the view ray
    float dens(vec3 d, float t){
      vec2 uv = d.xz / max(d.y, 0.055) * 0.55;
      uv += vec2(t*0.0075, t*0.0032);
      float f = fbm(uv*0.85);
      f += 0.42*fbm(uv*2.7 + vec2(-t*0.012, t*0.006));
      float c = smoothstep(0.62 - uCover*0.62, 1.02 - uCover*0.52, f + 0.5);
      return clamp(c, 0.0, 1.0);
    }

    void main(){
      vec3 d = normalize(vDir);
      if(d.y < 0.008){ discard; }
      float a = dens(d, uTime);
      if(a < 0.004){ discard; }

      // cheap self-shadow: step the density toward the sun
      float sh = 0.0;
      vec3 sd = normalize(uSun);
      for(int i=1;i<=4;i++){
        vec3 q = normalize(d + sd*(float(i)*0.055));
        sh += dens(q, uTime);
      }
      sh = clamp(sh*0.25, 0.0, 1.0);

      float lit  = pow(1.0 - sh, 1.9);
      float fw   = pow(max(dot(d, sd), 0.0), 7.0);        // forward scattering
      vec3  col  = uAmb * (0.35 + 0.30*(1.0-sh))
                 + uSunCol * (lit*0.95 + fw*1.25*lit)
                 + uSkyCol * 0.22;
      col = mix(col, uAmb*0.55, uNight*0.85);

      // dissolve into the horizon haze and thin out overhead
      float horiz = smoothstep(0.0, 0.26, d.y); horiz *= horiz;
      float top   = 1.0 - smoothstep(0.55, 1.0, d.y)*0.35;
      gl_FragColor = vec4(col, a*horiz*top*uOpacity);
    }`
});

const SKYST = {
  elev:0, turb:0, ray:0, mie:0, mieG:0, sunI:0, hemiI:0, fogD:0, exp:0,
  night:0, star:0, bloom:0, rayS:0, cloud:0, name:'',
  sun:new THREE.Color(), hemiS:new THREE.Color(), hemiG:new THREE.Color(),
  fog:new THREE.Color(), grade:new THREE.Color(),
};
const CYCLE = 180;
let dayT = 0.02;

function evalSky(t){
  t = ((t%1)+1)%1;
  let i=0; while(i<KEYS.length-2 && KEYS[i+1].t <= t) i++;
  const a=KEYS[i], b=KEYS[i+1];
  const u = smooth(a.t, b.t, t);
  SKYST.elev  = lerp(a.elev,b.elev,u);
  SKYST.turb  = lerp(a.turb,b.turb,u);
  SKYST.ray   = lerp(a.ray,b.ray,u);
  SKYST.mie   = lerp(a.mie,b.mie,u);
  SKYST.mieG  = lerp(a.mieG,b.mieG,u);
  SKYST.sunI  = lerp(a.sunI,b.sunI,u);
  SKYST.hemiI = lerp(a.hemiI,b.hemiI,u);
  SKYST.fogD  = lerp(a.fogD,b.fogD,u);
  SKYST.exp   = lerp(a.exp,b.exp,u);
  SKYST.night = lerp(a.night,b.night,u);
  SKYST.star  = lerp(a.star,b.star,u);
  SKYST.bloom = lerp(a.bloom,b.bloom,u);
  SKYST.rayS  = lerp(a.ray_,b.ray_,u);
  SKYST.cloud = lerp(a.cloud,b.cloud,u);
  SKYST.sun.copy(a.sun).lerp(b.sun,u);
  SKYST.hemiS.copy(a.hemiS).lerp(b.hemiS,u);
  SKYST.hemiG.copy(a.hemiG).lerp(b.hemiG,u);
  SKYST.fog.copy(a.fog).lerp(b.fog,u);
  SKYST.grade.copy(a.grade).lerp(b.grade,u);
  SKYST.name = u<0.5 ? a.name : b.name;
}

const sunDir = new THREE.Vector3();
const sunPosU = new THREE.Vector3();
function applySky(dt, camPos){
  evalSky(dayT);
  const az = 1.15 + dayT*0.9;
  const el = SKYST.elev*Math.PI/180;
  sunDir.set(Math.cos(el)*Math.cos(az), Math.sin(el), Math.cos(el)*Math.sin(az)).normalize();

  const u = sky.material.uniforms;
  u.turbidity.value = SKYST.turb;
  u.rayleigh.value  = SKYST.ray;
  u.mieCoefficient.value = SKYST.mie;
  u.mieDirectionalG.value = SKYST.mieG;
  u.uNight.value = SKYST.night;
  u.uGain.value  = 1.0;
  sunPosU.copy(sunDir).multiplyScalar(1000);
  u.sunPosition.value.copy(sunPosU);

  sky.position.copy(camPos);
  stars.position.copy(camPos);
  clouds.position.copy(camPos);
  starMat.uniforms.uOpacity.value = SKYST.star;

  const cu = cloudMat.uniforms;
  cu.uTime.value  = clock;
  cu.uSun.value.copy(sunDir);
  cu.uCover.value = SKYST.cloud;
  cu.uNight.value = SKYST.night;
  cu.uSunCol.value.copy(SKYST.sun).multiplyScalar(clamp(SKYST.sunI*0.26, 0.015, 1.5));
  cu.uSkyCol.value.copy(SKYST.hemiS).multiplyScalar(0.42);
  cu.uAmb.value.copy(SKYST.hemiS).multiplyScalar(0.30).lerp(SKYST.fog, 0.35);

  // moon opposite the sun
  const mdir = sunDir.clone().multiplyScalar(-1);
  mdir.x += 0.22; mdir.y = Math.abs(mdir.y)*0.85 + 0.12; mdir.normalize();
  moon.position.copy(camPos).addScaledVector(mdir, 8200);
  moon.material.opacity = SKYST.star;
  moonGlow.position.copy(moon.position);
  moonGlow.material.opacity = SKYST.star*0.55;

  // key light
  const isNight = SKYST.elev < -2;
  const lightDir = isNight ? mdir : sunDir;
  sunLight.color.copy(SKYST.sun);
  sunLight.intensity = SKYST.sunI;
  hemi.color.copy(SKYST.hemiS); hemi.groundColor.copy(SKYST.hemiG);
  hemi.intensity = SKYST.hemiI;
  ambient.intensity = 0.085 + SKYST.night*0.03;

  scene.fog.color.copy(SKYST.fog);
  scene.fog.density = SKYST.fogD;
  renderer.toneMappingExposure = SKYST.exp;
  envGround.material.color.copy(SKYST.fog).multiplyScalar(0.32);

  return lightDir;
}

  for(const A of ARCH){
    const d = Math.abs(z-A.z)/A.r;
    if(d<1){ const v = Math.cos(d*Math.PI*0.5); if(v>a){ a=v; y=A.y; w=A.w; } }
  }
  return {a:a*a*(3-2*a), y, w};
}

const PROF_N = 26;
function stationProfile(st){
  const [z,wF,wMax,wB,wR,yF,ySh,yB,yR] = st;
  const A = archAt(z);
  const wFl  = lerp(wF, 0.575, A.a);
  const yFl  = lerp(yF, 0.255, A.a);
  const wLow = lerp(wMax*0.985, A.w, A.a);
  const yLow = lerp(lerp(yF, ySh, 0.44), A.y, A.a);
  const yShE = clamp(Math.max(ySh, yLow + 0.05), 0, yB - 0.022);
  // fixed keypoint count so consecutive stations stay in correspondence
  const key = [
    [0.0,                      yFl              ],
    [wFl*0.72,                 yFl - 0.006      ],
    [wFl,                      yFl + 0.030      ],
    [wLow*0.985,               lerp(yFl,yLow,0.55)],
    [wLow,                     yLow             ],
    [lerp(wLow, wMax, 0.66),   lerp(yLow,yShE,0.52)],
    [wMax,                     yShE             ],
    [wMax*0.992,               yB - 0.042       ],
    [wB,                       yB               ],
    [wR*1.06,                  lerp(yB,yR,0.50) ],
    [wR,                       yR - 0.038       ],
    [0.0,                      yR               ],
  ];
  return resample(key, PROF_N);
}
/* Catmull-Rom resample of an open polyline */
function resample(pts, n){
  const out=[];
  const P=(i)=>pts[clamp(i,0,pts.length-1)];
  const segs = pts.length-1;
  for(let i=0;i<n;i++){
    const f = (i/(n-1))*segs;
    const s = Math.min(Math.floor(f), segs-1);
    const t = f-s;
    const p0=P(s-1), p1=P(s), p2=P(s+1), p3=P(s+2);
    const t2=t*t, t3=t2*t;
    const x=0.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3);
    const y=0.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3);
    out.push([Math.max(0,x),y]);
  }
  return out;
}

const HALVES = STATIONS.map(stationProfile);
/* Query the lofted skin so bolt-on parts sit on the surface instead of
   floating beside it or sinking inside it. Mirrors the mesh exactly: the
   loft is linear between stations, so linear interpolation is the truth. */
function bodyX(z, y){
  let i = 0;
  while(i < STATIONS.length-2 && STATIONS[i+1][0] < z) i++;
  const t = clamp((z - STATIONS[i][0])/(STATIONS[i+1][0]-STATIONS[i][0]), 0, 1);
  const A = HALVES[i], B = HALVES[i+1];
  let best = 0;
  for(let k=0;k<PROF_N-1;k++){
    const x1=lerp(A[k][0],B[k][0],t),   y1=lerp(A[k][1],B[k][1],t);
    const x2=lerp(A[k+1][0],B[k+1][0],t), y2=lerp(A[k+1][1],B[k+1][1],t);
    if(y1===y2) continue;
    const u=(y-y1)/(y2-y1);
    if(u>=0 && u<=1) best = Math.max(best, lerp(x1,x2,u));
  }
  return best;
}
/* highest point of the skin at a given z (roofline / deck height) */
function bodyTop(z){
  let i = 0;
  while(i < STATIONS.length-2 && STATIONS[i+1][0] < z) i++;
  const t = clamp((z - STATIONS[i][0])/(STATIONS[i+1][0]-STATIONS[i][0]), 0, 1);
  return lerp(HALVES[i][PROF_N-1][1], HALVES[i+1][PROF_N-1][1], t);
}

function buildCarBody(){
  const rows = STATIONS.length;
  const halves = HALVES;
  const cols = PROF_N*2-2;                      // mirrored, shared poles
  const pos=[], grpPaint=[], grpGlass=[], grpTrim=[];

  const V = (r,c)=>{
    const st = STATIONS[r], h = halves[r];
    let ci = c, sgn = 1;
    if(c >= PROF_N){ ci = cols - c; sgn = -1; }
    const p = h[clamp(ci,0,PROF_N-1)];
    return [p[0]*sgn, p[1], st[0]];
  };
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const v = V(r,c); pos.push(v[0],v[1],v[2]);
  }
  // glass region: cabin stations, the band between beltline and roof corner
  const isGlass = (r,c)=>{
    const z = STATIONS[r][0];
    if(z < -1.18 || z > 0.96) return false;
    const ci = c<PROF_N ? c : cols-c;
    return ci >= 18 && ci <= 22;
  };
  const isTrim = (r,c)=>{
    const ci = c<PROF_N ? c : cols-c;
    return ci <= 2;                               // underbody
  };
  for(let r=0;r<rows-1;r++)for(let c=0;c<cols;c++){
    const c2=(c+1)%cols;
    const a=r*cols+c, b=r*cols+c2, d=(r+1)*cols+c, e=(r+1)*cols+c2;
    const tri=[a,b,d, b,e,d];                     // outward-facing winding
    const g = isGlass(r,c)&&isGlass(r+1,c) ? grpGlass : (isTrim(r,c)?grpTrim:grpPaint);
    g.push(...tri);
  }
  // cap the nose and tail openings so the shell is closed
  for(const [r,front] of [[0,false],[rows-1,true]]){
    let cx=0, cy=0;
    for(let c=0;c<cols;c++){ const v=V(r,c); cx+=v[0]; cy+=v[1]; }
    cx/=cols; cy/=cols;
    const ci = pos.length/3;
    pos.push(cx, cy, STATIONS[r][0]);
    for(let c=0;c<cols;c++){
      const a=r*cols+c, b=r*cols+((c+1)%cols);
      grpTrim.push(front ? ci : ci, front ? a : b, front ? b : a);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  const all = grpPaint.concat(grpGlass, grpTrim);
  geo.setIndex(all);
  geo.addGroup(0, grpPaint.length, 0);
  geo.addGroup(grpPaint.length, grpGlass.length, 1);
  geo.addGroup(grpPaint.length+grpGlass.length, grpTrim.length, 2);
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, [paintMat, glassMat, carbonMat]);
  mesh.castShadow = true; mesh.receiveShadow = true;
  return mesh;
}

/* --- wheels ------------------------------------------------------------- */
/* RIM is the rim diameter as a fraction of the whole wheel — i.e. how much of
   the wheel is alloy and how much is rubber. The old 0.64 is a hatchback on
   65-profile tyres: two thirds of the wheel was black sidewall, which is why
   it read as a featureless disc from the road. A supercar sits on 30-profile
   rubber, and getting this ratio right does more for the silhouette than any
   amount of spoke detail. */
const RIM = 0.80;
function buildWheel(radius, width, spokes){
  const g = new THREE.Group();
  // tyre: lathe of the sidewall profile
  const pts=[];
  const hw = width/2;
  pts.push(new THREE.Vector2(radius*RIM , -hw*0.94));
  pts.push(new THREE.Vector2(radius*(RIM+0.06), -hw));
  pts.push(new THREE.Vector2(radius*0.99, -hw*0.86));
  pts.push(new THREE.Vector2(radius     , -hw*0.62));
  pts.push(new THREE.Vector2(radius     ,  hw*0.62));
  pts.push(new THREE.Vector2(radius*0.99,  hw*0.86));
  pts.push(new THREE.Vector2(radius*(RIM+0.06),  hw));
  pts.push(new THREE.Vector2(radius*RIM ,  hw*0.94));
  const tyre = new THREE.LatheGeometry(pts, 30);
  tyre.rotateZ(Math.PI/2);
  const tm = new THREE.Mesh(tyre, tyreMat);
  tm.castShadow = true; g.add(tm);

  // rim barrel
  const barrel = new THREE.CylinderGeometry(radius*RIM, radius*RIM, width*0.96, 26, 1, true);
  barrel.rotateZ(Math.PI/2);
  g.add(new THREE.Mesh(barrel, rimMat));
  // outer lip: the bright ring that catches the light and gives the wheel an edge
  const lip = new THREE.TorusGeometry(radius*RIM*0.985, radius*0.022, 6, 30);
  lip.rotateY(Math.PI/2); lip.translate(width*0.44, 0, 0);
  g.add(new THREE.Mesh(lip, chromeMat));
  // solid back to the barrel, so the gaps between spokes read as shadow.
  // +Z after rotateY(+90°) faces outboard, which is the side being looked at;
  // the other way round it is backface-culled and the body shows through.
  const back = new THREE.CircleGeometry(radius*RIM*0.99, 26);
  back.rotateY(Math.PI/2); back.translate(-width*0.30, 0, 0);
  g.add(new THREE.Mesh(back, rimBackMat));
  // spokes: tapered, dished back towards the hub like a real alloy
  const spokeL = radius*RIM*0.78;
  for(let i=0;i<spokes;i++){
    const sg = new THREE.BoxGeometry(width*0.30, spokeL, radius*0.115);
    // narrow the inboard end so the spoke reads as tapered, not as a bar
    const p = sg.attributes.position;
    for(let k=0;k<p.count;k++){
      const t = (p.getY(k)/spokeL) + 0.5;            // 0 at hub, 1 at rim
      p.setZ(k, p.getZ(k)*(0.42 + 0.58*t));
      p.setX(k, p.getX(k) - (1-t)*width*0.16);       // dish inwards
    }
    sg.computeVertexNormals();
    const m = new THREE.Mesh(sg, rimMat);
    m.position.x = width*0.24;
    m.rotation.x = (i/spokes)*TAU;
    m.position.y = Math.cos(m.rotation.x)*spokeL*0.52;
    m.position.z = Math.sin(m.rotation.x)*spokeL*0.52;
    m.castShadow = true;
    g.add(m);
  }
  // hub + centre cap
  const hub = new THREE.CylinderGeometry(radius*0.17, radius*0.17, width*0.44, 14);
  hub.rotateZ(Math.PI/2);
  g.add(new THREE.Mesh(hub, rimMat));
  const cap = new THREE.CylinderGeometry(radius*0.085, radius*0.075, 0.02, 14);
  cap.rotateZ(Math.PI/2); cap.translate(width*0.31, 0, 0);
  g.add(new THREE.Mesh(cap, caliperMat));
  // brake rotor, tucked well inboard so the spokes clearly sit in front of it
  const disc = new THREE.CylinderGeometry(radius*0.58, radius*0.58, 0.028, 22);
  disc.rotateZ(Math.PI/2);
  const dm = new THREE.Mesh(disc, rotorMat); dm.position.x = -width*0.12; g.add(dm);
  const cal = new THREE.Mesh(new THREE.BoxGeometry(0.06,0.20,0.13), caliperMat);
  cal.position.set(-width*0.12, radius*0.42, 0); g.add(cal);
  return g;
}

/* Only the top of the arch, never a full barrel. The liner is bigger than the
   tyre and drawn BackSide, so a complete cylinder puts the inside of its far
   wall between the camera and the wheel: from any side-on angle the wheel
   disappears behind a black disc. Sweeping just the upper half leaves the
   cavity above the tyre dark and the wheel itself visible. */
function wellLiner(z, radius, cy, halfW, width){
  const geo = new THREE.CylinderGeometry(radius, radius, width, 14, 1, true,

  geo.rotateZ(Math.PI/2);

    const m = new THREE.Mesh(geo, wellMat);
    m.position.set(sgn*(halfW-width*0.5), cy, z);

function box(w,h,d,mat,x,y,z,rx=0){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z); m.rotation.x=rx; m.castShadow=true; return m;
}
/* Panels that lie ON the lofted skin. Sampling bodyX per station means an
   intake or a lamp blade wraps the flank the way a real pressing does,
   instead of reading as a rectangle stuck onto curved paint. */
function skinStrip(mat, sgn, samples){
  const pos=[], idx=[], n=samples.length;
  for(const s of samples){
    const o = s.out ?? 0.006;
    pos.push(sgn*(bodyX(s.z,s.yT)+o), s.yT, s.z,
             sgn*(bodyX(s.z,s.yB)+o), s.yB, s.z);
  }
  for(let i=0;i<n-1;i++){
    const a=i*2, b=i*2+1, c=(i+1)*2, d=(i+1)*2+1;
    if(sgn>0) idx.push(a,c,b, b,c,d);
    else      idx.push(a,b,c, b,d,c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setIndex(idx); g.computeVertexNormals();
  return new THREE.Mesh(g, mat);
}
/* a lens/opening that tapers to points at both ends */
function skinBlade(mat, sgn, z0, z1, yMid, halfH, out, taper=0.30){
  const S=[], N=9;
  for(let i=0;i<N;i++){
    const f=i/(N-1);
    const z=lerp(z0,z1,f);
    const w=Math.sin(Math.PI*clamp((f*(1+taper)-taper*0.5),0,1))**0.55;
    const h=halfH*Math.max(0.10,w);
    const yc=yMid + (typeof out==='function'?0:0);
    S.push({z, yT:yc+h, yB:yc-h, out});
  }
  return skinStrip(mat, sgn, S);
}

/* ---- collapse the body into one draw call per material -------------------
   The car is modelled as ~120 separate meshes because that is the only sane
   way to author panel breaks, ducts and splitter blades. It is a terrible way
   to *submit* them: 120 draw calls, every frame, for an object that never
   changes shape. On a discrete GPU nobody notices; on the integrated laptop
   this has to run on, draw-call overhead is the framerate, and the car alone
   was a third of the frame's calls.

   Nothing here is animated by transform — the whole body pitches and rolls as
   one group — so the static parts can be baked into merged geometry. Wheels,
   flames and the volumetric cones move or fade independently and stay out. */
const exhaustPos = exhausts.map(e => e.position.clone());
/** Collapse every static mesh under `root` into one per material, in place. */
function mergeStatic(root, skip){
  /* updateWorldMatrix, not updateMatrixWorld: the latter takes the parent chain
     on trust, and at module scope nothing above the car has ever been updated.
     Taking `root`'s world matrix from a stale chain while each child resolves
     its own properly leaves the two disagreeing by exactly the intervening
     transform — which is how the wheels ended up hovering beside the car. */
  root.updateWorldMatrix(true, true);
  const toLocal = root.matrixWorld.clone().invert();
  const groups = new Map(), src = [], _m = new THREE.Matrix4();
  root.traverse(o => {
    if(!o.isMesh || (skip && skip.has(o))) return;
    // additive and other non-standard blends depend on being drawn separately
    if(o.material.blending !== THREE.NormalBlending) return;
    src.push(o);
  });
  for(const o of src){
    let g = groups.get(o.material.uuid);
    if(!g){ g = { mat:o.material, cast:false, recv:false, list:[] };
            groups.set(o.material.uuid, g); }
    // shadow flags are per-object; OR them rather than splitting the group,
    // since a rim spoke that starts casting is worth one fewer draw call
    g.cast = g.cast || o.castShadow; g.recv = g.recv || o.receiveShadow;
    g.list.push(o);
  }
  for(const g of groups.values()){
    if(g.list.length < 2) continue;
    const geos = g.list.map(o => {
      o.updateWorldMatrix(true, false);
      return o.geometry.clone().applyMatrix4(_m.copy(toLocal).multiply(o.matrixWorld));
    });
    const m = new THREE.Mesh(mergeGeos(geos), g.mat);
    m.castShadow = g.cast; m.receiveShadow = g.recv;
    m.name = 'merged';
    root.add(m);
    for(const x of geos) x.dispose();
    for(const o of g.list){ o.geometry.dispose(); o.removeFromParent(); }
  }
}
{

  const skip = new Set();
  for(const wh of wheelHub){ mergeStatic(wh.spin); wh.spin.traverse(o => skip.add(o)); }
